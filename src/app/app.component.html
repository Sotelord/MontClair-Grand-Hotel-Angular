<div class="min-h-screen flex flex-col w-full max-w-full overflow-x-hidden relative">
  @if (isAdmin()) {
    <app-admin-navbar />
  } @else if (isOperator()) {
    <app-operator-navbar />
  } @else if (isLogin()) {
    <header
      class="bg-mirage border-b border-white/10 px-4 sm:px-6 lg:px-12 py-3.5 flex items-center justify-between shadow-md w-full max-w-full overflow-x-hidden"
    >
      <div class="flex-1">
        <a routerLink="/" class="inline-flex items-center">
          <img
            src="images/Logo_oscuro_cropped.png"
            class="h-[46px] sm:h-[58px] w-auto max-w-[200px] sm:max-w-[240px] object-contain transition-transform hover:scale-[1.02]"
            alt="Montclair Grand Hotel"
          />
        </a>
      </div>

      <div class="flex-1 flex justify-end">
        <a
          routerLink="/"
          class="text-xs uppercase tracking-[2px] font-semibold text-twine hover:underline inline-flex items-center gap-1 cursor-pointer"
        >
          ← Volver al Inicio
        </a>
      </div>
    </header>
  } @else {
    <app-navbar />
  }

  <main class="flex-1 w-full max-w-full overflow-x-hidden">
    <router-outlet></router-outlet>
  </main>

  @if (isAdmin() || isOperator() || isLogin()) {
    <app-admin-footer />
  } @else {
    <app-footer />
    <!-- Burbuja Flotante de Asistente IA Concierge -->
    <app-chat-bubble />
  }
</div>
