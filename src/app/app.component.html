<div class="min-h-screen flex flex-col">
  @if (isAdmin()) {
    <app-admin-navbar />
  } @else if (isOperator()) {
    <app-operator-navbar />
  } @else if (isLogin()) {
    <header
      class="bg-mirage border-b border-white/10 px-6 lg:px-12 py-3.5 flex items-center justify-between shadow-md"
    >
      <div class="flex-1">
        <a routerLink="/" class="inline-flex items-center">
          <img
            src="images/Logo_oscuro.png"
            class="h-[70px] w-[200px] object-cover"
            alt="Montclair Grand Hotel"
          />
        </a>
      </div>

      <div class="flex-1 flex justify-end">
        <a
          routerLink="/"
          class="text-xs uppercase tracking-[2px] font-semibold text-twine hover:underline inline-flex items-center gap-1 cursor-pointer"
        >
          ← Volver al Inicio
        </a>
      </div>
    </header>
  } @else {
    <app-navbar />
  }

  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  @if (isAdmin() || isOperator() || isLogin()) {
    <app-admin-footer />
  } @else {
    <app-footer />
  }
</div>
