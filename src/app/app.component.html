<div class="min-h-screen flex flex-col">
  @if (isAdmin()) {
    <app-admin-navbar />
  } @else if (isLoginPage()) {
    <header
      class="bg-mirage border-b border-white/10 px-6 lg:px-12 py-3.5 flex items-center justify-between shadow-md"
    >
      <div class="flex-1">
        <a routerLink="/" class="inline-flex items-center">
          <img
            src="images/Logo_oscuro.png"
            class="h-[70px] w-[200px] object-cover"
            alt="Montclair Grand Hotel"
          />
        </a>
      </div>

      <div class="flex-1 flex justify-end">
        <a
          routerLink="/"
          class="text-xs uppercase tracking-[2px] font-semibold text-twine hover:underline inline-flex items-center gap-1 cursor-pointer"
        >
          ← Volver al Inicio
        </a>
      </div>
    </header>
  } @else {
    <app-navbar />
  }

  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  @if (isAdmin() || isLoginPage()) {
    <app-admin-footer />
  } @else {
    <app-footer />
  }
</div>

<!-- ========== MODAL RESERVA ========== -->
<div
  id="modal-reserva"
  class="modal-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-titulo-habitacion"
>
  <div class="modal-box">
    <button
      type="button"
      id="btn-cerrar-modal"
      class="close-btn"
      aria-label="Cerrar"
    >
      ✕
    </button>

    <div class="modal-header">
      <span class="modal-subtitle">Confirmación de Estancia</span>
      <h3 id="modal-titulo-habitacion">Deluxe Room</h3>
      <p id="modal-precio-noche">Tarifa: $116,52 € / noche</p>
    </div>

    <form id="form-completar-reserva" class="modal-form">
      <div class="form-group">
        <label for="nombre-huesped">Nombre Completo</label>
        <input
          type="text"
          id="nombre-huesped"
          name="nombre"
          required
          placeholder="Ej. Juan Pérez"
        />
      </div>
      <div class="form-group">
        <label for="correo-huesped">Correo Electrónico</label>
        <input
          type="email"
          id="correo-huesped"
          name="correo"
          required
          placeholder="ejemplo@correo.com"
        />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="modal-check-in">Check-In</label>
          <input type="date" id="modal-check-in" name="checkIn" required />
        </div>
        <div class="form-group">
          <label for="modal-check-out">Check-Out</label>
          <input type="date" id="modal-check-out" name="checkOut" required />
        </div>
      </div>
      <button type="submit" class="btn btn-primary full-width">
        Confirmar y Guardar Reserva
      </button>
    </form>
  </div>
</div>

<!-- ========== MODAL LOGIN ========== -->
<div
  id="modal-login"
  class="modal-overlay hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-login-titulo"
>
  <div class="modal-box">
    <button
      type="button"
      id="btn-cerrar-login"
      class="close-btn"
      aria-label="Cerrar"
    >
      ✕
    </button>

    <div class="modal-header">
      <span class="modal-subtitle">Acceso Clientes</span>
      <h3 id="modal-login-titulo">Iniciar Sesión</h3>
    </div>

    <form id="form-login" class="modal-form" novalidate>
      <div class="form-group">
        <label for="login-email">Correo Electrónico</label>
        <input
          type="email"
          id="login-email"
          name="email"
          placeholder="ejemplo@correo.com"
        />
        <p class="field-error hidden">Ingresa un correo electrónico válido.</p>
      </div>
      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <input
          type="password"
          id="login-password"
          name="password"
          placeholder="••••••••"
        />
        <p class="field-error hidden">Completa este campo.</p>
      </div>
      <button type="submit" class="btn btn-primary full-width">
        Iniciar Sesión
      </button>
    </form>
  </div>
</div>
