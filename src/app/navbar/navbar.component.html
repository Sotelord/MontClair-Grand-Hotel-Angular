<header>
  <nav
    class="bg-pampas sticky top-0 z-40 w-full border-b border-[rgba(202,198,198,0.5)] shadow-sm"
    aria-label="Navegación principal"
  >
    <div
      class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto px-6 py-3 relative"
    >
      <a href="/#inicio" class="flex items-center">
        <img
          src="images/Logo.jpg"
          class="h-[70px] w-[200px] object-cover"
          alt="Montclair Grand Hotel"
        />
      </a>

      <div class="flex items-center space-x-3">
        @if (!client) {
          <a
            href="/login"
            class="font-sans text-xs font-bold uppercase tracking-widest border border-twine text-twine px-4 py-2 rounded-sm transition-colors duration-300 hover:bg-twine hover:text-white inline-block"
          >
            Login
          </a>
        } @else {
          <div class="relative group">
            <a
              href="/profile"
              class="flex items-center gap-2 px-1 py-1 rounded-full hover:bg-pampas transition"
            >
              <img
                [src]="client.avatarUrl"
                alt="Mi perfil"
                class="w-9 h-9 rounded-full object-cover border-2 border-twine"
              />
              <span
                class="hidden sm:inline text-xs font-semibold text-woodsmoke max-w-[100px] truncate"
                >{{ client.firstName }}</span
              >
            </a>

            <ul
              class="absolute right-0 mt-1 w-48 bg-white border border-[#E8E2DA] rounded-[3px] shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 overflow-hidden"
            >
              <li>
                <a
                  href="/profile"
                  class="block px-4 py-2.5 text-xs text-woodsmoke hover:bg-pampas transition"
                  >Mi Perfil</a
                >
              </li>
              <li>
                <a
                  href="/reservations"
                  class="block px-4 py-2.5 text-xs text-woodsmoke hover:bg-pampas transition border-t border-[#E8E2DA]"
                  >Mis Reservas</a
                >
              </li>
              <li>
                <a
                  href="/logout"
                  class="block px-4 py-2.5 text-xs text-red-600 hover:bg-red-50 transition border-t border-[#E8E2DA]"
                  >Cerrar Sesión</a
                >
              </li>
            </ul>
          </div>
        }

        <a
          href="/rooms/cards"
          class="font-sans text-xs font-bold uppercase tracking-widest bg-twine text-white px-5 py-2.5 rounded-sm shadow-sm transition-colors duration-300 hover:bg-twine-hover inline-block"
        >
          Reservar Ahora
        </a>

        <button
          type="button"
          class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-woodsmoke rounded-sm md:hidden hover:bg-[#F0EBE3] focus:outline-none focus:ring-2 focus:ring-twine/30"
          aria-controls="navbar-index"
          aria-expanded="false"
        >
          <span class="sr-only">Abrir menú principal</span>
          <svg
            class="w-6 h-6"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-width="2"
              d="M5 7h14M5 12h14M5 17h14"
            />
          </svg>
        </button>
      </div>

      <div
        class="items-center justify-between hidden w-full md:flex md:w-auto md:absolute md:left-1/2 md:-translate-x-1/2"
        id="navbar-index"
      >
        <ul
          class="flex flex-col p-4 md:p-0 mt-4 font-sans text-xs font-semibold uppercase tracking-widest border border-[#E3DDD4] rounded-sm bg-white md:space-x-8 md:flex-row md:mt-0 md:border-0 md:bg-transparent"
        >
          <li>
            <a
              href="/#inicio"
              class="block py-2 px-3 text-woodsmoke rounded hover:text-twine md:p-0"
              >Inicio</a
            >
          </li>
          <li>
            <a
              href="/rooms/cards"
              class="block py-2 px-3 text-woodsmoke rounded hover:text-twine md:p-0"
              >Habitaciones</a
            >
          </li>
          <li>
            <a
              href="/services"
              class="block py-2 px-3 text-woodsmoke rounded hover:text-twine md:p-0"
              >Servicios</a
            >
          </li>
          <li>
            <a
              href="/gallery"
              class="block py-2 px-3 text-woodsmoke rounded hover:text-twine md:p-0"
              >Galería</a
            >
          </li>
          <li>
            <a
              href="/location"
              class="block py-2 px-3 text-woodsmoke rounded hover:text-twine md:p-0"
              >Ubicación</a
            >
          </li>
          <li>
            <a
              href="/#contacto"
              class="block py-2 px-3 text-woodsmoke rounded hover:text-twine md:p-0"
              >Contacto</a
            >
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
