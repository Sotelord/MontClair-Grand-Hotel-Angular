<div
  class="fixed inset-0 bg-mirage/60 backdrop-blur-xs flex items-center justify-center p-4 z-50"
>
  <div
    class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-2xl max-w-md w-full p-6 relative"
  >
    <h3 class="font-serif text-lg text-woodsmoke uppercase tracking-wider mb-2">
      {{ title() }}
    </h3>

    <p class="text-xs text-woodsmoke/70 mb-6 leading-relaxed">
      <ng-content />
    </p>

    <div class="flex justify-end gap-3">
      <button
        type="button"
        (click)="cancelled.emit()"
        class="px-4 py-2 border border-[#E8E2DA] hover:bg-pampas text-xs uppercase tracking-wider font-semibold text-woodsmoke rounded-[2px] transition cursor-pointer"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="confirmed.emit()"
        class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs uppercase tracking-wider font-semibold rounded-[2px] transition cursor-pointer"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
