<div
  class="fixed inset-0 bg-mirage/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 z-50"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-title"
  aria-describedby="modal-description"
>
  <div
    class="bg-white border border-[#E8E2DA] rounded-t-[8px] sm:rounded-[4px] shadow-2xl max-w-md w-full p-5 sm:p-6 relative overflow-y-auto max-h-[92dvh]"
  >
    <h3
      id="modal-title"
      class="font-serif text-lg text-woodsmoke uppercase tracking-wider mb-2"
    >
      {{ title() }}
    </h3>

    <p
      id="modal-description"
      class="text-sm text-woodsmoke/70 mb-6 leading-relaxed"
    >
      <ng-content />
    </p>

    <div
      class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 sm:gap-3"
    >
      <button
        type="button"
        id="modal-cancel-btn"
        (click)="cancelled.emit()"
        class="px-4 py-3 sm:py-2.5 border border-[#E8E2DA] hover:bg-pampas text-xs uppercase tracking-wider font-semibold text-woodsmoke rounded-[2px] transition cursor-pointer"
      >
        Cancelar
      </button>
      <button
        type="button"
        id="modal-confirm-btn"
        (click)="confirmed.emit()"
        class="px-4 py-3 sm:py-2.5 text-white text-xs uppercase tracking-wider font-semibold rounded-[2px] transition cursor-pointer"
        [class]="
          variant() === 'primary'
            ? 'bg-twine hover:bg-twine-hover'
            : 'bg-red-600 hover:bg-red-700'
        "
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
