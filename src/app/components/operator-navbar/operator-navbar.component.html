<header class="bg-mirage border-b border-white/10 px-6 lg:px-12 py-3.5 flex items-center justify-between shadow-md">
  <div class="flex-1">
    <a routerLink="/" class="inline-flex items-center">
      <img src="images/Logo_oscuro.png" class="h-[70px] w-[200px] object-cover" alt="Montclair Grand Hotel" />
    </a>
  </div>

  <nav class="hidden md:flex items-center gap-6 text-white/90">
    <a routerLink="/operator/reservations"
      class="text-[9px] uppercase tracking-[2px] font-semibold text-twine hover:text-twine transition">
      Reservas del Hotel
    </a>
  </nav>

  <div class="flex-1 flex justify-end gap-4 items-center">
    <a routerLink="/rooms/cards"
      class="text-xs uppercase tracking-[2px] font-semibold text-twine hover:underline inline-flex items-center gap-1">
      Vista Pública →
    </a>

    <button type="button" (click)="logout()"
      class="text-[10px] uppercase tracking-[1.5px] font-bold text-white/70 hover:text-white border border-white/20 hover:border-white/50 px-3 py-1.5 rounded-[2px] transition cursor-pointer"
      title="Volver al Login">
      Salir
    </button>
  </div>
</header>
