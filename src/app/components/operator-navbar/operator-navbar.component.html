<header
  class="bg-mirage border-b border-white/10 px-4 sm:px-6 lg:px-12 py-3 sm:py-3.5 shadow-md"
>
  <div class="flex items-center justify-between gap-4">
    <!-- Logo: monograma oscuro en celular, logo completo desde sm -->
    <div class="flex-1 min-w-0">
      <a routerLink="/" class="inline-flex items-center" (click)="closeMenu()">
        <img
          src="images/Logo_icon_oscuro.png"
          class="block sm:hidden h-[44px] w-auto transition-transform hover:scale-[1.02]"
          alt="Montclair Grand Hotel"
        />
        <img
          src="images/Logo_oscuro_cropped.png"
          class="hidden sm:block h-[58px] w-auto max-w-[240px] object-contain transition-transform hover:scale-[1.02]"
          alt="Montclair Grand Hotel"
        />
      </a>
    </div>

    <!-- Enlace central (escritorio) -->
    <nav
      class="hidden md:flex items-center gap-6"
      aria-label="Navegación del operador"
    >
      <a
        routerLink="/operator/reservations"
        routerLinkActive
        #rlaDesk="routerLinkActive"
        ariaCurrentWhenActive="page"
        class="text-[10px] uppercase tracking-[2px] font-semibold py-1 border-b transition-colors"
        [ngClass]="
          rlaDesk.isActive
            ? 'text-twine border-twine'
            : 'text-white/80 border-transparent hover:text-twine'
        "
      >
        Portal Operador • Reservas
      </a>
    </nav>

    <!-- Acciones (escritorio) y botón del menú (celular) -->
    <div class="flex-1 flex justify-end gap-3 sm:gap-4 items-center">
      <a
        routerLink="/rooms/cards"
        class="hidden md:inline-flex text-xs uppercase tracking-[2px] font-semibold text-twine hover:text-white transition-colors items-center gap-1"
      >
        Vista Pública →
      </a>

      <button
        type="button"
        (click)="logout()"
        class="hidden md:inline-block text-[10px] uppercase tracking-[1.5px] font-bold text-white/70 hover:text-white border border-white/20 hover:border-white/50 px-3 py-1.5 rounded-[2px] transition cursor-pointer"
        title="Cerrar Sesión"
      >
        Salir
      </button>

      <!-- Botón hamburguesa: recuadro con borde, cambia a dorado al abrir -->
      <button
        type="button"
        (click)="toggleMenu()"
        class="md:hidden w-10 h-10 grid place-items-center rounded-[2px] border transition-colors cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-twine/50"
        [ngClass]="
          isMenuOpen
            ? 'border-twine/60 bg-twine/10 text-twine'
            : 'border-white/15 text-white/85 hover:text-white hover:border-white/40'
        "
        [attr.aria-expanded]="isMenuOpen"
        aria-controls="operator-mobile-menu"
        [attr.aria-label]="
          isMenuOpen ? 'Cerrar menú de operador' : 'Abrir menú de operador'
        "
      >
        @if (isMenuOpen) {
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        } @else {
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 7h16M4 12h16M4 17h16"
            />
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- MENÚ DESPLEGABLE (celular/tablet) -->
  @if (isMenuOpen) {
    <div
      id="operator-mobile-menu"
      class="md:hidden mt-3 pt-3 border-t border-white/10 animate-fade-in"
    >
      <span
        class="block px-3 mb-2 text-[10px] uppercase tracking-[2.5px] text-white/40 font-bold"
      >
        Portal operador
      </span>

      <nav class="space-y-1" aria-label="Navegación del operador">
        <a
          routerLink="/operator/reservations"
          routerLinkActive
          #rlaMob="routerLinkActive"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
          class="flex items-center gap-3 px-3 py-3 border-l-2 text-xs uppercase tracking-[2px] font-semibold transition-colors"
          [ngClass]="
            rlaMob.isActive
              ? 'border-twine bg-white/5 text-twine'
              : 'border-transparent text-white/85 hover:bg-white/5 hover:text-twine'
          "
        >
          <svg
            class="w-4 h-4 shrink-0"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
            />
          </svg>
          Reservas del hotel
        </a>

        <a
          routerLink="/rooms/cards"
          (click)="closeMenu()"
          class="flex items-center gap-3 px-3 py-3 border-l-2 border-transparent text-xs uppercase tracking-[2px] font-semibold text-white/85 hover:bg-white/5 hover:text-twine transition-colors"
        >
          <svg
            class="w-4 h-4 shrink-0"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
            />
          </svg>
          Vista pública
        </a>
      </nav>

      <div class="mt-3 pt-3 border-t border-white/10">
        <button
          type="button"
          (click)="logout()"
          class="w-full flex items-center justify-center gap-2 py-3 border border-rose-400/30 text-rose-300 hover:bg-rose-500/10 hover:text-rose-200 text-[10px] uppercase tracking-[2px] font-bold rounded-[2px] transition-colors cursor-pointer"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
          Cerrar sesión
        </button>
      </div>
    </div>
  }
</header>
