<div
  class="mb-6 p-4 bg-emerald-50 border border-emerald-200 rounded-[2px] text-xs text-emerald-800 flex items-center justify-between animate-fade-in"
>
  <div class="flex items-center gap-2">
    <svg
      class="w-4 h-4 text-emerald-600 flex-shrink-0"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M5 13l4 4L19 7"
      />
    </svg>
    <span>{{ message() }}</span>
  </div>

  @if (dismissible()) {
    <button
      type="button"
      (click)="closed.emit()"
      class="text-emerald-600 hover:text-emerald-800 text-sm"
    >
      ✕
    </button>
  }
</div>
