<section
  class="bg-mirage bg-cover bg-center text-white pt-12 pb-10 sm:pt-16 sm:pb-14 lg:pt-20 lg:pb-16 px-6 lg:px-12 relative overflow-hidden"
  [style.background-image]="
    backgroundImage()
      ? 'linear-gradient(to right, rgba(20,30,38,0.9), rgba(20,30,38,0.8)), url(\'' +
        backgroundImage() +
        '\')'
      : null
  "
>
  <div class="max-w-4xl mx-auto text-center">
    <p
      class="font-sans text-[10px] sm:text-[11px] tracking-[3px] sm:tracking-[4px] text-twine uppercase font-bold mb-3 sm:mb-4"
    >
      {{ superiorText() }}
    </p>
    <h1
      class="font-serif text-[32px] sm:text-5xl md:text-[54px] font-normal tracking-[2px] leading-tight mb-3 sm:mb-5"
    >
      {{ title() }}
    </h1>
    <p
      class="font-sans text-[13px] sm:text-sm text-[#C2C9D1] font-light leading-relaxed max-w-2xl mx-auto mb-5 sm:mb-8"
    >
      {{ description() }}
    </p>
    <div class="flex items-center justify-center gap-3" aria-hidden="true">
      <div class="h-[1px] w-10 sm:w-14 bg-twine/40"></div>
      <div
        class="w-2 h-2 sm:w-2.5 sm:h-2.5 rotate-45 border border-twine bg-twine"
      ></div>
      <div class="h-[1px] w-10 sm:w-14 bg-twine/40"></div>
    </div>
  </div>
</section>
