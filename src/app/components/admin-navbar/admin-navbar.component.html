<header
  class="bg-mirage border-b border-white/10 px-4 sm:px-6 lg:px-12 py-3 shadow-md w-full max-w-full"
>
  <div class="flex items-center justify-between gap-4">
    <div class="flex-1 min-w-0">
      <a
        routerLink="/"
        class="inline-flex items-center py-0.5"
        (click)="closeMenu()"
      >
        <img
          src="images/Logo_icon_oscuro.png"
          class="block sm:hidden h-[44px] w-auto transition-transform hover:scale-[1.02]"
          alt="Montclair Grand Hotel"
        />
        <img
          src="images/Logo_oscuro_cropped.png"
          class="hidden sm:block h-[58px] w-auto max-w-[240px] object-contain transition-transform hover:scale-[1.02]"
          alt="Montclair Grand Hotel"
        />
      </a>
    </div>

    <nav
      class="hidden lg:flex items-center gap-6 xl:gap-8"
      aria-label="Panel de administración"
    >
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          [attr.aria-current]="isActive(item) ? 'page' : null"
          class="text-[10px] uppercase tracking-[2px] font-semibold py-1 border-b transition-colors whitespace-nowrap"
          [ngClass]="
            isActive(item)
              ? 'text-twine border-twine font-bold'
              : 'text-white/85 border-transparent hover:text-twine'
          "
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="flex-1 flex justify-end gap-3 sm:gap-4 items-center">
      <a
        routerLink="/rooms/cards"
        class="hidden lg:inline-flex text-xs uppercase tracking-[2px] font-semibold text-twine hover:text-white transition-colors items-center gap-1 whitespace-nowrap"
      >
        Vista Pública →
      </a>

      <button
        type="button"
        (click)="logout()"
        class="hidden lg:inline-block text-[10px] uppercase tracking-[1.5px] font-bold text-white/70 hover:text-white border border-white/20 hover:border-white/50 px-3 py-1.5 rounded-[2px] transition cursor-pointer"
        title="Cerrar Sesión"
      >
        Salir
      </button>

      <button
        type="button"
        (click)="toggleMenu()"
        class="lg:hidden w-10 h-10 grid place-items-center rounded-[2px] border transition-colors cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-twine/50"
        [ngClass]="
          isMenuOpen
            ? 'border-twine/60 bg-twine/10 text-twine'
            : 'border-white/15 text-white/85 hover:text-white hover:border-white/40'
        "
        [attr.aria-expanded]="isMenuOpen"
        aria-controls="admin-mobile-menu"
        [attr.aria-label]="
          isMenuOpen
            ? 'Cerrar panel de administración'
            : 'Abrir panel de administración'
        "
      >
        @if (isMenuOpen) {
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        } @else {
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 7h16M4 12h16M4 17h16"
            />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (isMenuOpen) {
    <div
      id="admin-mobile-menu"
      class="lg:hidden mt-3 pt-3 border-t border-white/10 animate-fade-in"
    >
      <span
        class="block px-3 mb-2 text-[10px] uppercase tracking-[2.5px] text-white/40 font-bold"
      >
        Panel de administración
      </span>

      <nav
        class="grid grid-cols-1 sm:grid-cols-2 gap-1"
        aria-label="Panel de administración"
      >
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            [attr.aria-current]="isActive(item) ? 'page' : null"
            (click)="closeMenu()"
            class="flex items-center gap-3 px-3 py-3 border-l-2 text-xs uppercase tracking-[2px] font-semibold transition-colors"
            [ngClass]="
              isActive(item)
                ? 'border-twine bg-white/5 text-twine'
                : 'border-transparent text-white/85 hover:bg-white/5 hover:text-twine'
            "
          >
            <svg
              class="w-4 h-4 shrink-0"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
                [attr.d]="item.icon"
              />
            </svg>
            {{ item.label }}
          </a>
        }

        <a
          routerLink="/rooms/cards"
          (click)="closeMenu()"
          class="flex items-center gap-3 px-3 py-3 border-l-2 border-transparent text-xs uppercase tracking-[2px] font-semibold text-white/85 hover:bg-white/5 hover:text-twine transition-colors"
        >
          <svg
            class="w-4 h-4 shrink-0"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
            />
          </svg>
          Vista pública
        </a>
      </nav>

      <div class="mt-3 pt-3 border-t border-white/10">
        <button
          type="button"
          (click)="logout()"
          class="w-full flex items-center justify-center gap-2 py-3 border border-rose-400/30 text-rose-300 hover:bg-rose-500/10 hover:text-rose-200 text-[10px] uppercase tracking-[2px] font-bold rounded-[2px] transition-colors cursor-pointer"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
          Cerrar sesión
        </button>
      </div>
    </div>
  }
</header>
