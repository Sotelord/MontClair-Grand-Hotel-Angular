<header class="bg-mirage border-b border-white/10 px-4 sm:px-6 lg:px-12 py-2.5 sm:py-3 shadow-md w-full max-w-full">
  <div class="flex items-center justify-between">
    <!-- Logo Grande y Nítido -->
    <div class="flex-1">
      <a routerLink="/" class="inline-flex items-center py-0.5">
        <img
          src="images/Logo_oscuro_cropped.png"
          class="h-[46px] sm:h-[58px] w-auto max-w-[200px] sm:max-w-[240px] object-contain transition-transform hover:scale-[1.02]"
          alt="Montclair Grand Hotel"
        />
      </a>
    </div>

    <!-- Enlaces Escritorio -->
    <nav class="hidden lg:flex items-center gap-6 text-white/90">
      <a routerLink="/admin/rooms" routerLinkActive="text-twine font-bold" class="text-[10px] uppercase tracking-[2px] font-semibold hover:text-twine transition">
        Habitaciones
      </a>

      <a routerLink="/admin/rooms-types" routerLinkActive="text-twine font-bold" class="text-[10px] uppercase tracking-[2px] font-semibold hover:text-twine transition">
        Tipos de Habitación
      </a>

      <a routerLink="/admin/reservations" routerLinkActive="text-twine font-bold" class="text-[10px] uppercase tracking-[2px] font-semibold hover:text-twine transition">
        Reservas
      </a>

      <a routerLink="/admin/clients" routerLinkActive="text-twine font-bold" class="text-[10px] uppercase tracking-[2px] font-semibold hover:text-twine transition">
        Clientes
      </a>

      <a routerLink="/admin/services" routerLinkActive="text-twine font-bold" class="text-[10px] uppercase tracking-[2px] font-semibold hover:text-twine transition">
        Servicios
      </a>
    </nav>

    <!-- Acciones Escritorio & Botón Móvil -->
    <div class="flex-1 flex justify-end gap-3 sm:gap-4 items-center">
      <a routerLink="/rooms/cards"
        class="hidden sm:inline-flex text-xs uppercase tracking-[2px] font-semibold text-twine hover:underline items-center gap-1">
        Vista Pública →
      </a>

      <button type="button" (click)="logout()"
        class="hidden sm:inline-block text-[10px] uppercase tracking-[1.5px] font-bold text-white/70 hover:text-white border border-white/20 hover:border-white/50 px-3 py-1.5 rounded-[2px] transition cursor-pointer"
        title="Cerrar Sesión">
        Salir
      </button>

      <!-- Botón Menú Móvil -->
      <button
        type="button"
        (click)="toggleMenu()"
        class="inline-flex items-center p-2 text-white/80 hover:text-white lg:hidden focus:outline-none cursor-pointer"
        [attr.aria-expanded]="isMenuOpen"
        aria-label="Abrir panel de administración"
      >
        @if (isMenuOpen) {
          <svg class="w-6 h-6 text-twine" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        } @else {
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Desplegable Móvil Admin -->
  @if (isMenuOpen) {
    <div class="lg:hidden mt-3 pt-3 border-t border-white/10 space-y-2 text-white/90 animate-fade-in">
      <a routerLink="/admin/rooms" (click)="closeMenu()" class="block py-2 text-xs uppercase tracking-[2px] font-semibold hover:text-twine transition">
        Habitaciones
      </a>
      <a routerLink="/admin/rooms-types" (click)="closeMenu()" class="block py-2 text-xs uppercase tracking-[2px] font-semibold hover:text-twine transition">
        Tipos de Habitación
      </a>
      <a routerLink="/admin/reservations" (click)="closeMenu()" class="block py-2 text-xs uppercase tracking-[2px] font-semibold hover:text-twine transition">
        Reservas
      </a>
      <a routerLink="/admin/clients" (click)="closeMenu()" class="block py-2 text-xs uppercase tracking-[2px] font-semibold hover:text-twine transition">
        Clientes
      </a>
      <a routerLink="/admin/services" (click)="closeMenu()" class="block py-2 text-xs uppercase tracking-[2px] font-semibold hover:text-twine transition">
        Servicios
      </a>

      <div class="pt-3 border-t border-white/10 flex items-center justify-between">
        <a routerLink="/rooms/cards" (click)="closeMenu()" class="text-xs uppercase tracking-[2px] font-semibold text-twine hover:underline">
          Vista Pública →
        </a>
        <button type="button" (click)="logout()" class="text-xs text-red-400 hover:text-red-300 font-semibold uppercase tracking-wider">
          Cerrar Sesión
        </button>
      </div>
    </div>
  }
</header>
