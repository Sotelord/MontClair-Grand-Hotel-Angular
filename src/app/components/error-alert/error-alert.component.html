<div
  class="mb-6 p-4 rounded-[3px] bg-red-50 border border-red-200 text-red-800 text-sm font-semibold flex items-start justify-between gap-3"
  role="alert"
>
  <div class="flex items-start gap-2 min-w-0">
    <svg
      class="w-4 h-4 mt-0.5 text-red-600 flex-shrink-0"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <span class="leading-snug">{{ message() }}</span>
  </div>

  <button
    type="button"
    (click)="closed.emit()"
    class="shrink-0 text-red-500 hover:text-red-700 cursor-pointer"
    aria-label="Cerrar aviso"
  >
    ✕
  </button>
</div>
