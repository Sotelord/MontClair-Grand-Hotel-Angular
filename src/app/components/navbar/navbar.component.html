<header>
  <nav class="bg-pampas sticky top-0 z-40 w-full border-b border-[rgba(202,198,198,0.5)] shadow-sm"
    aria-label="Navegación principal">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto px-6 py-3 gap-4">
      <a routerLink="/" fragment="inicio" class="flex items-center shrink-0">
        <img src="images/Logo.jpg" class="h-[70px] w-[200px] object-cover" alt="Montclair Grand Hotel" />
      </a>

      <div class="flex items-center space-x-3 md:order-2 shrink-0">
        @if (currentClient) {
        <a [routerLink]="['/profile', currentClient.id]"
          class="font-sans text-xs font-bold uppercase tracking-widest border border-twine text-twine px-4 py-2 rounded-sm transition-colors duration-300 hover:bg-twine hover:text-white inline-block cursor-pointer whitespace-nowrap">
          Mi Perfil
        </a>
        } @else {
        <a routerLink="/login"
          class="font-sans text-xs font-bold uppercase tracking-widest border border-twine text-twine px-4 py-2 rounded-sm transition-colors duration-300 hover:bg-twine hover:text-white inline-block cursor-pointer whitespace-nowrap">
          Login
        </a>
        }

        <a routerLink="/reservations/book"
          class="font-sans text-xs font-bold uppercase tracking-widest bg-twine text-white px-5 py-2.5 rounded-sm shadow-sm transition-colors duration-300 hover:bg-twine-hover inline-block whitespace-nowrap">
          Reservar Ahora
        </a>

        <button type="button"
          class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-woodsmoke rounded-sm md:hidden hover:bg-[#F0EBE3] focus:outline-none focus:ring-2 focus:ring-twine/30"
          aria-controls="navbar-index" aria-expanded="false">
          <span class="sr-only">Abrir menú principal</span>
          <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
            viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14" />
          </svg>
        </button>
      </div>

      <div
        class="items-center justify-center hidden w-full md:flex md:w-auto md:order-1"
        id="navbar-index">
        <ul
          class="flex flex-col p-4 md:p-0 mt-4 font-sans text-xs font-semibold uppercase tracking-widest border border-[#E3DDD4] rounded-sm bg-white md:space-x-6 lg:space-x-8 md:flex-row md:mt-0 md:border-0 md:bg-transparent">
          <li>
            <a routerLink="/" fragment="inicio" class="block py-2 px-3 text-woodsmoke rounded hover:text-twine md:p-0 whitespace-nowrap">
              Inicio
            </a>
          </li>

          <li>
            <a routerLink="/rooms/cards" class="block py-2 px-3 text-woodsmoke rounded hover:text-twine md:p-0 whitespace-nowrap">
              Habitaciones
            </a>
          </li>

          <li>
            <a routerLink="/services" class="block py-2 px-3 text-woodsmoke rounded hover:text-twine md:p-0 whitespace-nowrap">
              Servicios
            </a>
          </li>

          <li>
            <a routerLink="/gallery" class="block py-2 px-3 text-woodsmoke rounded hover:text-twine md:p-0 whitespace-nowrap">
              Galería
            </a>
          </li>

          <li>
            <a routerLink="/location" class="block py-2 px-3 text-woodsmoke rounded hover:text-twine md:p-0 whitespace-nowrap">
              Ubicación & Contacto
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
