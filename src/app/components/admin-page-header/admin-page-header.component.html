<div
  class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-6 sm:mb-8"
>
  <div class="min-w-0">
    <p
      class="font-sans text-[10px] tracking-[3px] sm:tracking-[4px] text-twine uppercase font-bold mb-1"
    >
      {{ superiorText() }}
    </p>
    <h1
      class="font-serif text-2xl sm:text-3xl text-woodsmoke tracking-[2px] uppercase"
    >
      {{ title() }}
    </h1>
    <div class="flex items-center gap-3 mt-2.5" aria-hidden="true">
      <div class="h-[1px] w-12 bg-twine"></div>
      <div class="w-1.5 h-1.5 rotate-45 border border-twine bg-twine"></div>
    </div>
    <p class="text-sm text-woodsmoke/60 mt-3 max-w-3xl leading-relaxed">
      {{ description() }}
    </p>
  </div>

  @if (buttonText()) {
    <div class="shrink-0">
      <button
        type="button"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-twine hover:bg-twine-hover text-white text-[10px] uppercase tracking-[2px] font-bold py-3 px-5 rounded-[2px] transition duration-300 shadow-sm cursor-pointer"
        (click)="onButtonClick()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-3.5 h-3.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        {{ buttonText() }}
      </button>
    </div>
  }
</div>
