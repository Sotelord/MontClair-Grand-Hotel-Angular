<div
  class="bg-mirage text-white p-6 sm:p-8 rounded-[4px] mb-8 border border-twine/30 relative overflow-hidden shadow-lg"
>
  <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-4">
      <img
        [src]="client().avatarUrl || defaultAvatar"
        [alt]="client().firstName"
        class="w-14 h-14 rounded-full object-cover border-2 border-twine shadow-sm"
      />

      <div>
        <span
          class="text-[9px] uppercase tracking-[3px] text-twine font-bold block mb-0.5"
        >
          {{
            isEditMode()
              ? "MODIFICANDO RESERVA #" + reservationId() + " DE"
              : "RESERVA A NOMBRE DE"
          }}
        </span>

        <h1 class="font-serif text-xl sm:text-2xl uppercase tracking-[1px]">
          {{ client().firstName }} {{ client().lastName || "" }}
        </h1>

        <p class="text-xs text-silver font-mono">
          {{ client().email }} • Huésped ID: #{{ client().id }}
        </p>
      </div>
    </div>

    <div class="text-right sm:border-l sm:border-white/10 sm:pl-6">
      <span
        class="text-[10px] uppercase tracking-wider text-twine block font-semibold"
      >
        Garantía Montclair
      </span>
      <span class="text-xs text-silver font-light">
        Tarifa oficial directa sin comisiones
      </span>
    </div>
  </div>
</div>
