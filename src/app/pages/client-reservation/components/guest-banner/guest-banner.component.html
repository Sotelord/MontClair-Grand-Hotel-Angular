<div
  class="bg-mirage text-white p-6 sm:p-8 mb-6 border border-[#E8E2DA]/20 border-b-2 border-b-twine relative overflow-hidden shadow-xl"
>
  <div class="flex flex-col sm:flex-row items-center justify-between gap-6">
    <div class="flex flex-col sm:flex-row items-center gap-5 text-center sm:text-left">
      <div class="p-1 border-2 border-twine rounded-full bg-mirage shadow-md shrink-0">
        <img
          [src]="client().avatarUrl || defaultAvatar"
          [alt]="client().firstName"
          class="w-14 h-14 sm:w-16 sm:h-16 rounded-full object-cover"
        />
      </div>

      <div>
        <span
          class="font-sans text-[9px] uppercase tracking-[3px] text-twine font-bold block mb-1"
        >
          {{
            isEditMode()
              ? "MODIFICANDO RESERVA #" + reservationId() + " DE"
              : "TITULAR DE LA RESERVA"
          }}
        </span>

        <h2 class="font-serif text-xl sm:text-2xl uppercase tracking-[1.5px] text-white">
          {{ client().firstName }} {{ client().lastName || "" }}
        </h2>

        <p class="text-xs text-[#C2C9D1] font-sans mt-1">
          {{ client().email }} &bull; Huésped #{{ client().id }}
        </p>
      </div>
    </div>

    <div class="text-center sm:text-right sm:border-l sm:border-white/15 sm:pl-6">
      <span
        class="font-sans text-[9px] uppercase tracking-[2.5px] text-twine block font-bold mb-1"
      >
        GARANTÍA MONTCLAIR
      </span>
      <span class="text-xs text-[#C2C9D1] font-light">
        Tarifa oficial directa &bull; Sin comisiones
      </span>
    </div>
  </div>
</div>
