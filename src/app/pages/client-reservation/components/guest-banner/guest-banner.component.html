<div
  class="bg-mirage text-white px-5 py-4 sm:p-6 lg:p-8 mb-5 sm:mb-6 border border-[#E8E2DA]/20 border-b-2 border-b-twine relative overflow-hidden shadow-[0_10px_30px_-12px_rgba(20,30,38,0.22)]"
>
  <div class="flex items-center justify-between gap-6">
    <div class="flex items-center gap-4 sm:gap-5 min-w-0">
      <div
        class="p-0.5 sm:p-1 border-2 border-twine rounded-full bg-mirage shadow-md shrink-0"
      >
        <img
          [src]="client().avatarUrl || defaultAvatar"
          [alt]="client().firstName"
          class="w-12 h-12 sm:w-16 sm:h-16 rounded-full object-cover"
        />
      </div>

      <div class="min-w-0">
        <span
          class="font-sans text-[10px] uppercase tracking-[2.5px] sm:tracking-[3px] text-twine font-bold block mb-0.5 sm:mb-1"
        >
          {{
            isEditMode()
              ? "MODIFICANDO RESERVA #" + reservationId() + " DE"
              : "TITULAR DE LA RESERVA"
          }}
        </span>

        <h2
          class="font-serif text-lg sm:text-2xl uppercase tracking-[1.5px] text-white truncate"
        >
          {{ client().firstName }} {{ client().lastName || "" }}
        </h2>

        <p
          class="text-xs sm:text-sm text-[#C2C9D1] font-sans mt-0.5 sm:mt-1 truncate"
        >
          {{ client().email
          }}<span class="hidden sm:inline">
            &bull; Huésped #{{ client().id }}</span
          >
        </p>
      </div>
    </div>

    <div
      class="hidden md:block text-right border-l border-white/15 pl-6 shrink-0"
    >
      <span
        class="font-sans text-[10px] uppercase tracking-[2.5px] text-twine block font-bold mb-1"
      >
        GARANTÍA MONTCLAIR
      </span>
      <span class="text-sm text-[#C2C9D1] font-light">
        Tarifa oficial directa &bull; Sin comisiones
      </span>
    </div>
  </div>
</div>
