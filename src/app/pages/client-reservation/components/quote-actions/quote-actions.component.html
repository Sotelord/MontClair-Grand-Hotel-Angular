<div class="space-y-3 pt-1">
  <button
    type="submit"
    id="btn-confirmar-reserva"
    [disabled]="isDisabled()"
    class="w-full bg-twine hover:bg-twine-hover text-white text-[10.5px] uppercase tracking-[2px] font-bold py-4 px-4 transition-colors duration-300 shadow-sm cursor-pointer disabled:opacity-50"
  >
    {{
      isSubmitting()
        ? "Procesando Reserva..."
        : isEditMode()
          ? "Guardar Cambios en Reserva"
          : "Confirmar y Garantizar Reserva"
    }}
  </button>

  <a
    [routerLink]="isEditMode() ? ['/profile', clientId()] : ['/rooms/cards']"
    class="w-full text-center block border border-[#E8E2DA] hover:border-twine text-woodsmoke/75 hover:text-twine text-[10px] uppercase tracking-[2px] font-bold py-3 px-4 transition-colors duration-300"
  >
    {{
      isEditMode() ? "Cancelar y Volver a Mi Perfil" : "Ver Otras Habitaciones"
    }}
  </a>
</div>
