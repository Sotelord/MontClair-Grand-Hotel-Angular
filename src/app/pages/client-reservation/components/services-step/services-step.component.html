<div
  class="bg-white border border-[#E8E2DA] p-5 sm:p-7 lg:p-9 shadow-[0_10px_30px_-12px_rgba(20,30,38,0.22)]"
>
  <div class="mb-5 sm:mb-6 pb-4 sm:pb-5 border-b border-[#E8E2DA]">
    <span
      class="font-sans text-[10px] uppercase tracking-[3px] font-bold text-twine block mb-1.5"
    >
      PASO 03 &bull; CONCIERGE &amp; EXPERIENCIAS
    </span>

    <h2
      class="font-serif text-xl sm:text-2xl uppercase tracking-[1.5px] text-woodsmoke"
    >
      Experiencias Opcionales
    </h2>

    <div class="flex items-center gap-3 mt-2.5" aria-hidden="true">
      <div class="h-[1px] w-10 bg-twine"></div>
      <div class="w-1.5 h-1.5 rotate-45 border border-twine bg-twine"></div>
    </div>

    <p class="text-sm text-woodsmoke/60 mt-3">
      Personalice su estancia (puede elegir varias).
    </p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
    @for (svc of services(); track svc.id) {
      <label
        class="p-4 sm:p-5 border transition-all duration-200 cursor-pointer flex items-start gap-3.5"
        [ngClass]="
          selectedIds().has(svc.id)
            ? 'border-twine bg-twine/[0.06] shadow-xs'
            : 'border-[#E8E2DA] bg-[#FAF8F5] hover:border-twine/50 hover:bg-white'
        "
      >
        <input
          type="checkbox"
          [checked]="selectedIds().has(svc.id)"
          (change)="toggled.emit(svc.id)"
          class="mt-0.5 h-4 w-4 shrink-0 accent-[#bf925a] cursor-pointer"
        />

        <div class="flex-grow min-w-0">
          <div class="flex justify-between items-baseline gap-2 mb-1">
            <h4
              class="font-serif text-sm font-semibold text-woodsmoke uppercase tracking-[0.5px]"
            >
              {{ svc.name }}
            </h4>
            <span
              class="text-sm font-serif font-bold text-twine-hover shrink-0"
              >{{ formatPrice(svc.price) }}</span
            >
          </div>

          <p class="text-[13px] text-woodsmoke/65 leading-relaxed line-clamp-2">
            {{ svc.description }}
          </p>
        </div>
      </label>
    }
  </div>
</div>
