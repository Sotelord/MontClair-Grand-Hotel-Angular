<div
  class="bg-white border border-[#E8E2DA] p-7 sm:p-9 shadow-sm hover:shadow-md transition-shadow"
>
  <div class="mb-6 pb-5 border-b border-[#E8E2DA] flex flex-col sm:flex-row sm:items-end justify-between gap-2">
    <div>
      <span
        class="font-sans text-[9px] uppercase tracking-[3px] font-bold text-twine block mb-1.5"
      >
        PASO 03 &bull; CONCIERGE &amp; EXPERIENCIAS
      </span>

      <h2 class="font-serif text-xl sm:text-2xl uppercase tracking-[1.5px] text-woodsmoke">
        Servicios &amp; Experiencias Opcionales
      </h2>

      <div class="flex items-center gap-3 mt-2.5">
        <div class="h-[1px] w-10 bg-twine"></div>
        <div class="w-1.5 h-1.5 rotate-45 border border-twine bg-twine"></div>
      </div>
    </div>

    <span
      class="font-sans text-[9.5px] uppercase tracking-[2px] text-woodsmoke/50 font-semibold"
    >
      Personalice su estancia
    </span>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    @for (svc of services(); track svc.id) {
      <div
        (click)="toggled.emit(svc.id)"
        class="p-5 border transition-all duration-200 cursor-pointer flex items-start gap-3.5"
        [ngClass]="
          selectedIds().has(svc.id)
            ? 'border-twine bg-twine/[0.06] shadow-xs'
            : 'border-[#E8E2DA] bg-pampas/15 hover:border-twine/50 hover:bg-white'
        "
      >
        <input
          type="checkbox"
          [checked]="selectedIds().has(svc.id)"
          class="mt-1 h-4 w-4 accent-[#bf925a] border-[#E8E2DA] cursor-pointer"
          (click)="$event.stopPropagation(); toggled.emit(svc.id)"
        />

        <div class="flex-grow">
          <div class="flex justify-between items-baseline gap-2 mb-1">
            <h4
              class="font-serif text-xs sm:text-sm font-semibold text-woodsmoke uppercase tracking-[0.5px]"
            >
              {{ svc.name }}
            </h4>
            <span class="text-xs font-serif font-bold text-twine-dark shrink-0">{{
              formatPrice(svc.price)
            }}</span>
          </div>

          <p class="text-[11px] text-woodsmoke/65 leading-relaxed line-clamp-2">
            {{ svc.description }}
          </p>
        </div>
      </div>
    }
  </div>
</div>
