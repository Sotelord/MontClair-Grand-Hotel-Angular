<div
  class="bg-white border border-[#E8E2DA] rounded-[4px] p-6 sm:p-8 shadow-sm"
>
  <span
    class="text-[9px] uppercase tracking-[3px] font-bold text-twine block mb-2"
    >PASO 3</span
  >

  <div class="flex justify-between items-baseline mb-4">
    <h2 class="font-serif text-xl uppercase tracking-wider text-woodsmoke">
      Servicios & Experiencias Opcionales
    </h2>

    <span
      class="text-[10px] uppercase tracking-wider text-woodsmoke/50 font-medium"
    >
      Personalice su estancia
    </span>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    @for (svc of services(); track svc.id) {
      <div
        (click)="toggled.emit(svc.id)"
        class="p-4 rounded-[2px] border transition cursor-pointer flex items-start gap-3"
        [ngClass]="
          selectedIds().has(svc.id)
            ? 'border-twine bg-amber-50/50'
            : 'border-[#E8E2DA] hover:border-twine/50'
        "
      >
        <input
          type="checkbox"
          [checked]="selectedIds().has(svc.id)"
          class="mt-1 h-4 w-4 text-twine rounded-[2px] focus:ring-twine border-[#E8E2DA] cursor-pointer"
          (click)="$event.stopPropagation(); toggled.emit(svc.id)"
        />

        <div class="flex-grow">
          <div class="flex justify-between items-center mb-0.5">
            <h4
              class="font-serif text-xs font-semibold text-woodsmoke uppercase"
            >
              {{ svc.name }}
            </h4>
            <span class="text-xs font-mono font-semibold text-twine-dark">{{
              formatPrice(svc.price)
            }}</span>
          </div>

          <p class="text-[10px] text-woodsmoke/60 line-clamp-2">
            {{ svc.description }}
          </p>
        </div>
      </div>
    }
  </div>
</div>
