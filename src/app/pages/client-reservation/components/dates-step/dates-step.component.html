<div
  [formGroup]="form()"
  class="bg-white border border-[#E8E2DA] rounded-[4px] p-6 sm:p-8 shadow-sm"
>
  <span
    class="text-[9px] uppercase tracking-[3px] font-bold text-twine block mb-2"
    >PASO 2</span
  >

  <h2 class="font-serif text-xl uppercase tracking-wider text-woodsmoke mb-4">
    Fechas de Estancia y Huéspedes
  </h2>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
    <div>
      <label
        class="block text-[11px] uppercase tracking-wider font-semibold text-woodsmoke mb-2"
      >
        Fecha de Entrada
      </label>
      <input
        type="date"
        formControlName="checkInDate"
        [attr.min]="isEditMode() ? null : todayDate()"
        max="9999-12-31"
        class="w-full px-4 py-2.5 text-xs bg-pampas/40 border border-[#E8E2DA] rounded-[2px] focus:outline-none focus:border-twine text-woodsmoke font-mono"
      />
    </div>

    <div>
      <label
        class="block text-[11px] uppercase tracking-wider font-semibold text-woodsmoke mb-2"
      >
        Fecha de Salida
      </label>
      <input
        type="date"
        formControlName="checkOutDate"
        [attr.min]="minCheckOutDate()"
        max="9999-12-31"
        class="w-full px-4 py-2.5 text-xs bg-pampas/40 border border-[#E8E2DA] rounded-[2px] focus:outline-none focus:border-twine text-woodsmoke font-mono"
      />
    </div>

    <div>
      <label
        class="block text-[11px] uppercase tracking-wider font-semibold text-woodsmoke mb-2"
      >
        Número de Huéspedes
      </label>
      <input
        type="number"
        formControlName="numberOfPeople"
        min="1"
        max="10"
        class="w-full px-4 py-2.5 text-xs bg-pampas/40 border border-[#E8E2DA] rounded-[2px] focus:outline-none focus:border-twine text-woodsmoke font-mono"
      />
    </div>
  </div>

  <div
    class="mt-4 pt-4 border-t border-[#E8E2DA] flex items-center justify-between text-xs text-woodsmoke/70"
  >
    <span>Duración calculada:</span>
    <span class="font-mono font-semibold text-woodsmoke">
      {{ nightsCount() }} {{ nightsCount() === 1 ? "Noche" : "Noches" }}
    </span>
  </div>
</div>
