<section class="max-w-6xl w-full mx-auto p-6 sm:p-8 lg:p-12">
  <app-booking-breadcrumb
    [isEditMode]="isEditMode"
    [reservationId]="reservationId"
  ></app-booking-breadcrumb>
  @if (!currentUser) {
    <app-login-required></app-login-required>
  } @else {
    <app-guest-banner
      [client]="currentUser"
      [isEditMode]="isEditMode"
      [reservationId]="reservationId"
    ></app-guest-banner>
    @if (errorMessage) {
      <app-error-alert
        [message]="errorMessage"
        (closed)="errorMessage = null"
      ></app-error-alert>
    }

    @if (successMessage) {
      <app-success-alert [message]="successMessage"></app-success-alert>
    }

    <form [formGroup]="bookingForm" (ngSubmit)="onSubmit()">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-8">
          <!-- PASO 1 -->
          <app-room-type-step
            [form]="bookingForm"
            [roomTypes]="roomTypes"
            [selectedRoomType]="selectedRoomType"
          ></app-room-type-step>
          <!-- PASO 2 -->
          <app-dates-step
            [form]="bookingForm"
            [isEditMode]="isEditMode"
            [todayDate]="todayDate"
            [minCheckOutDate]="minCheckOutDate"
            [nightsCount]="nightsCount"
          ></app-dates-step>
          <!-- PASO 3 -->
          <app-services-step
            [services]="services"
            [selectedIds]="selectedServiceIds"
            (toggled)="toggleService($event)"
          ></app-services-step>
        </div>

        <!-- RESUMEN -->
        <div class="lg:col-span-1">
          <div
            class="bg-white border border-[#E8E2DA] rounded-[4px] p-6 sm:p-8 shadow-lg sticky top-24 space-y-6"
          >
            <app-quote-summary
              [selectedRoomType]="selectedRoomType"
              [nightsCount]="nightsCount"
              [roomTotal]="roomTotal"
              [servicesCount]="selectedServiceIds.size"
              [servicesTotal]="servicesTotal"
              [grandTotal]="grandTotal"
            ></app-quote-summary>
            <app-booking-benefits></app-booking-benefits>
            <app-quote-actions
              [isSubmitting]="isSubmitting"
              [isDisabled]="isSubmitting || !selectedRoomType"
              [isEditMode]="isEditMode"
              [clientId]="currentUser.id"
            ></app-quote-actions>
          </div>
        </div>
      </div>
    </form>
  }
</section>
