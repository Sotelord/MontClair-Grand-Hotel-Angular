<section class="max-w-6xl w-full mx-auto p-6 sm:p-8 lg:p-12">
  <app-admin-page-header
    superiorText="CATEGORÍAS DE ALOJAMIENTO"
    title="Tipos de Habitación"
    description="Configuración y definición de tarifas base por categoría de estancia."
    buttonText="Añadir Tipo de Habitación"
    (buttonClick)="onAdd()"
  />

  @if (successMessage) {
    <app-success-alert
      [message]="successMessage"
      [dismissible]="true"
      (closed)="successMessage = null"
    ></app-success-alert>
  }

  @if (errorMessage) {
    <app-error-alert
      [message]="errorMessage"
      (closed)="errorMessage = null"
    ></app-error-alert>
  }

  <app-room-types-table
    [roomTypes]="roomTypes"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  />
</section>
