<section class="max-w-6xl w-full mx-auto px-4 py-6 sm:p-8 lg:p-12">
  <app-admin-page-header
    superiorText="CATEGORÍAS DE ALOJAMIENTO"
    title="Tipos de Habitación"
    description="Configuración y definición de tarifas base por categoría de estancia."
    buttonText="Añadir Tipo de Habitación"
    (buttonClick)="onAdd()"
  />

  @if (successMessage) {
    <app-success-alert
      [message]="successMessage"
      [dismissible]="true"
      (closed)="successMessage = null"
    ></app-success-alert>
  }

  @if (errorMessage) {
    <app-error-alert
      [message]="errorMessage"
      (closed)="errorMessage = null"
    ></app-error-alert>
  }

  <app-room-types-table
    [roomTypes]="roomTypes"
    (edit)="onEdit($event)"
    (delete)="confirmDelete($event)"
  />

  @if (typeToDelete) {
    <app-confirm-modal
      title="Eliminar categoría"
      confirmLabel="Eliminar"
      (confirmed)="executeDelete()"
      (cancelled)="cancelDelete()"
    >
      ¿Deseas eliminar la categoría
      <strong class="text-woodsmoke">{{ typeToDelete.name }}</strong
      >? Solo es posible si no tiene habitaciones asociadas. Esta acción no se
      puede deshacer.
    </app-confirm-modal>
  }
</section>
