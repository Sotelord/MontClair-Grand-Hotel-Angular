<section class="max-w-6xl w-full mx-auto p-6 sm:p-8 lg:p-12">
  <app-admin-page-header
    superiorText="CATEGORÍAS DE ALOJAMIENTO"
    title="Tipos de Habitación"
    description="Configuración y definición de tarifas base por categoría de estancia."
    buttonText="Añadir Tipo de Habitación"
    (buttonClick)="onAdd()"
  />

  @if (successMessage) {
    <div class="mb-6 p-4 rounded-[4px] bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-semibold flex items-center justify-between">
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4 text-emerald-600 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>{{ successMessage }}</span>
      </div>
      <button (click)="successMessage = null" class="text-emerald-600 hover:text-emerald-800 text-sm">✕</button>
    </div>
  }

  @if (errorMessage) {
    <div class="mb-6 p-4 rounded-[4px] bg-red-50 border border-red-200 text-red-800 text-xs font-semibold flex items-center justify-between">
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4 text-red-600 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
      <button (click)="errorMessage = null" class="text-red-600 hover:text-red-800 text-sm">✕</button>
    </div>
  }

  <app-room-types-table
    [roomTypes]="roomTypes"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  />
</section>
