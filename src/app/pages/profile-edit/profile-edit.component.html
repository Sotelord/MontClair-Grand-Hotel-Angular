@if (client && profileForm) {
  <section class="max-w-3xl w-full mx-auto p-6 sm:p-8 lg:p-12">
    <app-profile-breadcrumb [clientId]="client.id"></app-profile-breadcrumb>

    <div
      class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-xl overflow-hidden relative"
    >
      <div
        class="h-1.5 bg-gradient-to-r from-twine-dark via-twine to-twine-light"
      ></div>

      <div class="p-6 sm:p-10">
        <app-edit-header [avatarUrl]="avatarPreview"></app-edit-header>

        @if (errorMessage) {
          <app-error-alert
            [message]="errorMessage"
            (closed)="errorMessage = null"
          ></app-error-alert>
        }

        @if (successMessage) {
          <app-success-alert [message]="successMessage"></app-success-alert>
        }

        <form
          [formGroup]="profileForm"
          (ngSubmit)="onSubmit()"
          class="space-y-6"
        >
          <app-personal-fields [form]="profileForm"></app-personal-fields>
          <app-avatar-field [form]="profileForm"></app-avatar-field>
          <app-password-fields [form]="profileForm"></app-password-fields>
          <app-edit-actions
            [isSubmitting]="isSubmitting"
            [clientId]="client.id"
          ></app-edit-actions>
        </form>
      </div>
    </div>
  </section>
}
