<div [formGroup]="form()" class="pt-6 border-t border-[#E8E2DA] space-y-4">
  <div>
    <h3 class="font-serif text-base uppercase text-woodsmoke tracking-wide">
      Seguridad de la Cuenta
    </h3>
    <p class="text-[11px] text-woodsmoke/60">
      Deje estos campos en blanco si no desea modificar su contraseña actual.
    </p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
    <div>
      <label
        class="block text-[11px] uppercase tracking-wider font-semibold text-woodsmoke mb-2"
      >
        Nueva Contraseña
      </label>
      <input
        type="password"
        formControlName="newPassword"
        placeholder="Mínimo 4 caracteres"
        class="w-full px-4 py-2.5 text-xs bg-pampas/30 border border-[#E8E2DA] rounded-[2px] focus:outline-none focus:border-twine focus:ring-1 focus:ring-twine text-woodsmoke"
      />
    </div>

    <div>
      <label
        class="block text-[11px] uppercase tracking-wider font-semibold text-woodsmoke mb-2"
      >
        Confirmar Nueva Contraseña
      </label>
      <input
        type="password"
        formControlName="confirmPassword"
        placeholder="Repita la contraseña"
        class="w-full px-4 py-2.5 text-xs bg-pampas/30 border border-[#E8E2DA] rounded-[2px] focus:outline-none focus:border-twine focus:ring-1 focus:ring-twine text-woodsmoke"
      />
    </div>
  </div>
</div>
