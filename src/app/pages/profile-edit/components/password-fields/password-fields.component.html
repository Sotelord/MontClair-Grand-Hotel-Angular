<div [formGroup]="form()" class="pt-6 border-t border-[#E8E2DA] space-y-5">
  <div>
    <span
      class="font-sans text-[9px] uppercase tracking-[3px] text-twine font-bold block mb-1"
    >
      03 &bull; CREDENCIALES DE ACCESO
    </span>
    <h3 class="font-serif text-lg uppercase text-woodsmoke tracking-[1px]">
      Seguridad de la Cuenta
    </h3>
    <p class="text-[11px] text-woodsmoke/60 mt-1">
      Deje estos campos en blanco si desea conservar su contraseña actual.
    </p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
    <div>
      <label
        class="block font-sans text-[10px] uppercase tracking-[2px] font-bold text-woodsmoke mb-2"
      >
        Nueva Contraseña
      </label>
      <input
        type="password"
        formControlName="newPassword"
        placeholder="Mínimo 4 caracteres"
        class="w-full px-4 py-3 text-xs bg-pampas/30 border border-[#E8E2DA] focus:outline-none focus:border-twine focus:bg-white transition-colors text-woodsmoke"
      />
    </div>

    <div>
      <label
        class="block font-sans text-[10px] uppercase tracking-[2px] font-bold text-woodsmoke mb-2"
      >
        Confirmar Nueva Contraseña
      </label>
      <input
        type="password"
        formControlName="confirmPassword"
        placeholder="Repita la contraseña"
        class="w-full px-4 py-3 text-xs bg-pampas/30 border border-[#E8E2DA] focus:outline-none focus:border-twine focus:bg-white transition-colors text-woodsmoke"
      />
    </div>
  </div>
</div>
