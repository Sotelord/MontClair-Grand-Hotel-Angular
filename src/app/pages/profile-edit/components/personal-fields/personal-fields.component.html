<div [formGroup]="form()" class="space-y-6">
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
    <div>
      <label
        class="block font-sans text-[10px] uppercase tracking-[2px] font-bold text-woodsmoke mb-2"
      >
        Nombre <span class="text-twine">*</span>
      </label>
      <input
        type="text"
        formControlName="firstName"
        placeholder="Ej. Carlos"
        class="w-full px-4 py-3 text-xs bg-pampas/30 border border-[#E8E2DA] focus:outline-none focus:border-twine focus:bg-white transition-colors text-woodsmoke"
      />
      @if (showError("firstName")) {
        <p class="text-[10px] text-rose-700 mt-1.5">
          El nombre es obligatorio (mínimo 2 letras).
        </p>
      }
    </div>

    <div>
      <label
        class="block font-sans text-[10px] uppercase tracking-[2px] font-bold text-woodsmoke mb-2"
      >
        Apellidos
      </label>
      <input
        type="text"
        formControlName="lastName"
        placeholder="Ej. González Mendoza"
        class="w-full px-4 py-3 text-xs bg-pampas/30 border border-[#E8E2DA] focus:outline-none focus:border-twine focus:bg-white transition-colors text-woodsmoke"
      />
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
    <div>
      <label
        class="block font-sans text-[10px] uppercase tracking-[2px] font-bold text-woodsmoke mb-2"
      >
        Correo Electrónico <span class="text-twine">*</span>
      </label>
      <input
        type="email"
        formControlName="email"
        placeholder="correo@ejemplo.com"
        class="w-full px-4 py-3 text-xs bg-pampas/30 border border-[#E8E2DA] focus:outline-none focus:border-twine focus:bg-white transition-colors text-woodsmoke"
      />
      @if (showError("email")) {
        <p class="text-[10px] text-rose-700 mt-1.5">
          Ingrese un correo electrónico válido.
        </p>
      }
    </div>

    <div>
      <label
        class="block font-sans text-[10px] uppercase tracking-[2px] font-bold text-woodsmoke mb-2"
      >
        Teléfono de Contacto
      </label>
      <input
        type="tel"
        formControlName="phone"
        placeholder="+34 600 000 000"
        class="w-full px-4 py-3 text-xs bg-pampas/30 border border-[#E8E2DA] focus:outline-none focus:border-twine focus:bg-white transition-colors text-woodsmoke"
      />
      @if (showError("phone")) {
        <p class="text-[10px] text-rose-700 mt-1.5">
          Formato de teléfono no válido.
        </p>
      }
    </div>
  </div>
</div>
