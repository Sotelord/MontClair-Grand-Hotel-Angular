<div [formGroup]="form()" class="space-y-6">
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
    <div>
      <label
        class="block text-[11px] uppercase tracking-wider font-semibold text-woodsmoke mb-2"
      >
        Nombre <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        formControlName="firstName"
        placeholder="Ej. Carlos"
        class="w-full px-4 py-2.5 text-xs bg-pampas/30 border border-[#E8E2DA] rounded-[2px] focus:outline-none focus:border-twine focus:ring-1 focus:ring-twine text-woodsmoke"
      />
      @if (showError("firstName")) {
        <p class="text-[10px] text-red-600 mt-1">
          El nombre es obligatorio (mínimo 2 letras).
        </p>
      }
    </div>

    <div>
      <label
        class="block text-[11px] uppercase tracking-wider font-semibold text-woodsmoke mb-2"
      >
        Apellidos
      </label>
      <input
        type="text"
        formControlName="lastName"
        placeholder="Ej. González Mendoza"
        class="w-full px-4 py-2.5 text-xs bg-pampas/30 border border-[#E8E2DA] rounded-[2px] focus:outline-none focus:border-twine focus:ring-1 focus:ring-twine text-woodsmoke"
      />
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
    <div>
      <label
        class="block text-[11px] uppercase tracking-wider font-semibold text-woodsmoke mb-2"
      >
        Correo Electrónico <span class="text-red-500">*</span>
      </label>
      <input
        type="email"
        formControlName="email"
        placeholder="correo@ejemplo.com"
        class="w-full px-4 py-2.5 text-xs bg-pampas/30 border border-[#E8E2DA] rounded-[2px] focus:outline-none focus:border-twine focus:ring-1 focus:ring-twine text-woodsmoke"
      />
      @if (showError("email")) {
        <p class="text-[10px] text-red-600 mt-1">
          Ingrese un correo electrónico válido.
        </p>
      }
    </div>

    <div>
      <label
        class="block text-[11px] uppercase tracking-wider font-semibold text-woodsmoke mb-2"
      >
        Teléfono de Contacto
      </label>
      <input
        type="tel"
        formControlName="phone"
        placeholder="+34 600 000 000"
        class="w-full px-4 py-2.5 text-xs bg-pampas/30 border border-[#E8E2DA] rounded-[2px] focus:outline-none focus:border-twine focus:ring-1 focus:ring-twine text-woodsmoke font-mono"
      />
      @if (showError("phone")) {
        <p class="text-[10px] text-red-600 mt-1">
          Formato de teléfono no válido.
        </p>
      }
    </div>
  </div>
</div>
