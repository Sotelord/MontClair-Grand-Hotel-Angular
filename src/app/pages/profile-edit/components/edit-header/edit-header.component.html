<div
  class="mb-8 pb-6 border-b border-[#E8E2DA] flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4"
>
  <div>
    <span
      class="text-[9px] uppercase tracking-[3px] text-twine font-bold block mb-1"
    >
      CUENTA DE HUÉSPED
    </span>

    <h1
      class="font-serif text-2xl sm:text-3xl uppercase tracking-[1px] text-woodsmoke"
    >
      Actualizar Mi Perfil
    </h1>

    <p class="text-xs text-woodsmoke/60 font-light mt-1">
      Modifique sus datos personales y preferencias de contacto.
    </p>
  </div>

  <div class="flex items-center gap-3">
    <img
      [src]="avatarUrl()"
      alt="Foto de perfil"
      class="w-16 h-16 rounded-full object-cover border-2 border-twine shadow-sm"
    />
  </div>
</div>
