<div [formGroup]="form()" class="pt-6 border-t border-[#E8E2DA]">
  <span
    class="font-sans text-[9px] uppercase tracking-[3px] text-twine font-bold block mb-1.5"
  >
    02 &bull; IDENTIDAD VISUAL
  </span>
  <label
    class="block font-sans text-[10px] uppercase tracking-[2px] font-bold text-woodsmoke mb-2.5"
  >
    URL de Fotografía de Perfil (Avatar)
  </label>

  <input
    type="url"
    formControlName="avatarUrl"
    placeholder="https://images.unsplash.com/..."
    class="w-full px-4 py-3 text-xs bg-pampas/30 border border-[#E8E2DA] focus:outline-none focus:border-twine focus:bg-white transition-colors text-woodsmoke"
  />

  <p class="text-[10.5px] text-woodsmoke/55 mt-1.5">
    Pegue el enlace directo a su fotografía (Unsplash, Cloudinary, etc.). La vista previa a la izquierda se actualizará en tiempo real.
  </p>
</div>
