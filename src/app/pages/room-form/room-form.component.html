<div class="flex items-center justify-center p-6 py-12">
  <div
    class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-xl w-full max-w-2xl p-8 sm:p-10 relative overflow-hidden"
  >
    <div
      class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-twine-dark via-twine to-twine-light"
    ></div>

    <app-room-form-header [isEditMode]="isEditMode"></app-room-form-header>

    @if (errorMessage) {
      <app-error-alert
        [message]="errorMessage"
        (closed)="errorMessage = null"
      ></app-error-alert>
    }

    <form [formGroup]="roomForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <app-identity-fields [form]="roomForm"></app-identity-fields>
      <app-category-fields
        [form]="roomForm"
        [roomTypes]="roomTypes"
      ></app-category-fields>
      <app-specs-fields [form]="roomForm"></app-specs-fields>
      <app-media-fields [form]="roomForm"></app-media-fields>
      <app-room-form-actions [isEditMode]="isEditMode"></app-room-form-actions>
    </form>
  </div>
</div>
