<div [formGroup]="form()" class="space-y-5">
  <div>
    <label
      class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
    >
      URL de Imagen Principal (Opcional)
    </label>
    <input
      type="url"
      formControlName="secondaryImageUrl"
      placeholder="https://images.unsplash.com/..."
      class="w-full bg-pampas/60 border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-xs text-woodsmoke outline-none transition"
    />
    <p class="text-[10px] text-woodsmoke/50 mt-1">
      Si se deja vacío, se heredará la imagen del tipo de habitación
      seleccionado.
    </p>
  </div>

  <div>
    <label
      class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
    >
      Descripción de la Estancia (Opcional)
    </label>
    <textarea
      formControlName="heroDescription"
      rows="3"
      placeholder="Descripción detallada de la habitación..."
      class="w-full bg-pampas/60 border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-xs text-woodsmoke outline-none transition resize-none"
    ></textarea>
  </div>
</div>
