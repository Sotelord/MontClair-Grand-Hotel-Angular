<fieldset [formGroup]="form()" class="min-w-0">
  <legend class="flex items-center gap-3 w-full mb-4">
    <span
      class="w-6 h-6 shrink-0 grid place-items-center rounded-full bg-mirage text-twine text-[10px] font-bold"
      >4</span
    >
    <span
      class="text-[10px] uppercase tracking-[2.5px] font-bold text-twine-hover whitespace-nowrap"
      >Imagen y descripción</span
    >
    <span class="flex-1 h-px bg-[#E8E2DA]" aria-hidden="true"></span>
  </legend>

  <div class="space-y-4">
    <div>
      <label
        for="room-image"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >URL de imagen principal (opcional)</label
      >
      <!-- Vista previa al lado del campo cuando hay una URL -->
      <div class="flex items-start gap-3">
        <input
          id="room-image"
          type="url"
          formControlName="secondaryImageUrl"
          placeholder="https://images.unsplash.com/..."
          class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition flex-1 min-w-0"
        />
        @if (imageUrl) {
          <img
            [src]="imageUrl"
            alt="Vista previa"
            class="w-16 h-11 shrink-0 object-cover rounded-[2px] border border-[#E8E2DA] bg-pampas"
          />
        }
      </div>
      <p class="text-[11px] text-woodsmoke/50 mt-1.5">
        Si se deja vacío, se usará la imagen del tipo de habitación
        seleccionado.
      </p>
    </div>

    <div>
      <label
        for="room-description"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >Descripción de la estancia (opcional)</label
      >
      <textarea
        id="room-description"
        formControlName="heroDescription"
        rows="4"
        placeholder="Descripción detallada de la habitación..."
        class="w-full bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-base sm:text-sm text-woodsmoke outline-none transition resize-y min-h-[100px]"
      ></textarea>
    </div>
  </div>
</fieldset>
