<fieldset [formGroup]="form()" class="min-w-0">
  <legend class="flex items-center gap-3 w-full mb-4">
    <span
      class="w-6 h-6 shrink-0 grid place-items-center rounded-full bg-mirage text-twine text-[10px] font-bold"
      >2</span
    >
    <span
      class="text-[10px] uppercase tracking-[2.5px] font-bold text-twine-hover whitespace-nowrap"
      >Categoría y estado</span
    >
    <span class="flex-1 h-px bg-[#E8E2DA]" aria-hidden="true"></span>
  </legend>

  <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
    <div class="col-span-2 sm:col-span-1 min-w-0">
      <label
        for="room-type"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >Tipo de habitación *</label
      >
      <div class="relative">
        <select
          id="room-type"
          formControlName="typeId"
          class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition appearance-none pr-9 cursor-pointer"
        >
          @for (type of roomTypes(); track type.id) {
            <option [value]="type.id">
              {{ type.name }} (€{{ type.pricePerNight }})
            </option>
          }
        </select>
        <svg
          class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-twine"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.2"
            d="M6 9l6 6 6-6"
          />
        </svg>
      </div>
    </div>

    <div class="min-w-0">
      <label
        for="room-floor"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >Piso *</label
      >
      <input
        id="room-floor"
        type="number"
        formControlName="floor"
        min="1"
        inputmode="numeric"
        placeholder="ej. 1"
        class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition"
        [class.border-red-400]="isInvalid('floor')"
      />
    </div>

    <div class="min-w-0">
      <label
        for="room-status"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >Estado *</label
      >
      <div class="relative">
        <select
          id="room-status"
          formControlName="status"
          class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition appearance-none pr-9 cursor-pointer"
        >
          <option value="AVAILABLE">Disponible</option>
          <option value="MAINTENANCE">Mantenimiento</option>
        </select>
        <svg
          class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-twine"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.2"
            d="M6 9l6 6 6-6"
          />
        </svg>
      </div>
    </div>
  </div>
  @if (isInvalid("floor")) {
    <span class="text-[11px] text-red-600 mt-1 block"
      >El piso debe ser 1 o mayor.</span
    >
  }
</fieldset>
