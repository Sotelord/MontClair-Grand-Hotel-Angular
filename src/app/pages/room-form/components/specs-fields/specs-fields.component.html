<fieldset [formGroup]="form()" class="min-w-0">
  <legend class="flex items-center gap-3 w-full mb-4">
    <span
      class="w-6 h-6 shrink-0 grid place-items-center rounded-full bg-mirage text-twine text-[10px] font-bold"
      >3</span
    >
    <span
      class="text-[10px] uppercase tracking-[2.5px] font-bold text-twine-hover whitespace-nowrap"
      >Especificaciones</span
    >
    <span class="flex-1 h-px bg-[#E8E2DA]" aria-hidden="true"></span>
  </legend>

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
    <div class="min-w-0">
      <label
        for="room-price"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >Tarifa / noche *</label
      >
      <div class="relative">
        <span
          class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm text-twine-hover font-semibold"
          >€</span
        >
        <input
          id="room-price"
          type="number"
          step="0.01"
          min="1"
          inputmode="decimal"
          formControlName="pricePerNight"
          placeholder="116.52"
          class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition pl-7 tabular-nums"
          [class.border-red-400]="isInvalid('pricePerNight')"
        />
      </div>
    </div>

    <div class="min-w-0">
      <label
        for="room-capacity"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >Capacidad *</label
      >
      <input
        id="room-capacity"
        type="number"
        min="1"
        inputmode="numeric"
        formControlName="capacity"
        placeholder="2"
        class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition"
        [class.border-red-400]="isInvalid('capacity')"
      />
    </div>

    <div class="min-w-0">
      <label
        for="room-bed"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >Tipo de cama *</label
      >
      <input
        id="room-bed"
        type="text"
        formControlName="bedType"
        placeholder="King Size"
        class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition"
        [class.border-red-400]="isInvalid('bedType')"
      />
    </div>

    <div class="min-w-0">
      <label
        for="room-area"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >Área *</label
      >
      <div class="relative">
        <input
          id="room-area"
          type="number"
          min="10"
          inputmode="numeric"
          formControlName="area"
          placeholder="35"
          class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition pr-10 tabular-nums"
          [class.border-red-400]="isInvalid('area')"
        />
        <span
          class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-xs text-woodsmoke/50"
          >m²</span
        >
      </div>
    </div>
  </div>

  @if (
    isInvalid("pricePerNight") ||
    isInvalid("capacity") ||
    isInvalid("bedType") ||
    isInvalid("area")
  ) {
    <span class="text-[11px] text-red-600 mt-2 block">
      Revisa los campos marcados: la tarifa y la capacidad deben ser mayores a 0
      y el área de al menos 10 m².
    </span>
  }
</fieldset>
