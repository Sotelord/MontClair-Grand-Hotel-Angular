@if (variant() === "success") {
  <div
    class="bg-emerald-50 border border-emerald-200 text-emerald-900 p-4 rounded-[3px] mb-6 shadow-xs flex items-center gap-3"
  >
    <svg
      class="w-5 h-5 text-emerald-700 flex-shrink-0"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <div>
      <h4 class="font-bold text-xs uppercase tracking-wider text-emerald-800">
        {{ title() }}
      </h4>
      <p class="text-xs text-emerald-700 mt-0.5">{{ message() }}</p>
    </div>
  </div>
} @else {
  <div
    class="bg-red-50 border border-red-200 text-red-800 p-4 rounded-[3px] mb-6 shadow-xs flex items-center gap-3"
  >
    <svg
      class="w-5 h-5 text-red-600 flex-shrink-0"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="15" y1="9" x2="9" y2="15"></line>
      <line x1="9" y1="9" x2="15" y2="15"></line>
    </svg>
    <div>
      <h4 class="font-bold text-xs uppercase tracking-wider text-red-700">
        {{ title() }}
      </h4>
      <p class="text-xs text-red-600 mt-0.5">{{ message() }}</p>
    </div>
  </div>
}
