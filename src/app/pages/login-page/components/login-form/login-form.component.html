<form (ngSubmit)="submitted.emit()" class="space-y-5">
  <div>
    <label
      class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
    >
      Usuario o Correo Electrónico
    </label>
    <input
      type="text"
      [ngModel]="identifier()"
      (ngModelChange)="identifier.set($event)"
      name="identifier"
      placeholder="ej. demo o demo@example.com"
      required
      class="w-full bg-pampas/60 border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-xs text-woodsmoke outline-none transition"
    />
  </div>

  <div>
    <label
      class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
    >
      Contraseña
    </label>
    <input
      type="password"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      name="password"
      placeholder="••••••••"
      required
      class="w-full bg-pampas/60 border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-xs text-woodsmoke outline-none transition"
    />
  </div>

  <button
    type="submit"
    class="w-full bg-twine hover:bg-twine-hover text-white text-[10px] uppercase tracking-[2px] font-bold py-3.5 px-6 rounded-[2px] transition duration-300 shadow-sm cursor-pointer"
  >
    Validar e Iniciar Sesión
  </button>
</form>
