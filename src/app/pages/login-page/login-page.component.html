<div class="flex items-center justify-center p-6 py-12">
  <div
    class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-xl w-full max-w-md p-8 sm:p-10 relative overflow-hidden"
  >
    <div
      class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-twine-dark via-twine to-twine-light"
    ></div>
    <app-login-header></app-login-header>
    @if (successMessage) {
      <app-login-alert
        variant="success"
        title="¡Éxito!"
        [message]="successMessage"
      ></app-login-alert>
    }

    @if (errorMessage) {
      <app-login-alert
        variant="error"
        title="Error de Autenticación"
        [message]="errorMessage"
      ></app-login-alert>
    }
    <app-login-form
      [(identifier)]="identifier"
      [(password)]="password"
      (submitted)="onLogin()"
    ></app-login-form>

    <button
      type="button"
      id="google-login-btn"
      (click)="onGoogleLogin()"
      [disabled]="isLoading || isGoogleLoading"
      class="w-full mt-3 bg-white border border-[#E8E2DA] text-woodsmoke hover:border-twine hover:text-twine-dark disabled:opacity-60 disabled:cursor-not-allowed text-[10px] uppercase tracking-[2px] font-bold py-3.5 px-6 rounded-[2px] transition duration-300 shadow-sm cursor-pointer flex items-center justify-center gap-2"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.04H12v3.86h5.38a4.6 4.6 0 0 1-2 3.02v2.53h3.24c1.9-1.75 3-4.33 3-7.37z"/>
        <path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.42l-3.24-2.53c-.9.6-2.05.96-3.38.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.61A10 10 0 0 0 12 22z"/>
        <path fill="#FBBC05" d="M6.39 13.88A6 6 0 0 1 6.07 12c0-.65.11-1.29.32-1.88V7.51H3.04A10 10 0 0 0 2 12c0 1.61.38 3.14 1.04 4.49l3.35-2.61z"/>
        <path fill="#EA4335" d="M12 5.99c1.47 0 2.79.51 3.83 1.51l2.87-2.88A9.65 9.65 0 0 0 12 2a10 10 0 0 0-8.96 5.51l3.35 2.61C7.18 7.75 9.39 5.99 12 5.99z"/>
      </svg>
      {{ isGoogleLoading ? 'Conectando...' : 'Continuar con Google' }}
    </button>

    <app-demo-access
      class="block mt-5"
      (selected)="fillDemo($event)"
    ></app-demo-access>

    <app-register-prompt></app-register-prompt>
  </div>
</div>
