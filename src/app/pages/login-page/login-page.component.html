<div class="flex items-center justify-center p-6 py-12">
  <div
    class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-xl w-full max-w-md p-8 sm:p-10 relative overflow-hidden"
  >
    <div
      class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-twine-dark via-twine to-twine-light"
    ></div>
    <app-login-header></app-login-header>
    @if (successMessage) {
      <app-login-alert
        variant="success"
        title="¡Éxito!"
        [message]="successMessage"
      ></app-login-alert>
    }

    @if (errorMessage) {
      <app-login-alert
        variant="error"
        title="Error de Autenticación"
        [message]="errorMessage"
      ></app-login-alert>
    }
    <app-login-form
      [(identifier)]="identifier"
      [(password)]="password"
      (submitted)="onLogin()"
    ></app-login-form>
    <app-demo-access
      class="block mt-5"
      (selected)="fillDemo($event)"
    ></app-demo-access>

    <app-register-prompt></app-register-prompt>
  </div>
</div>
