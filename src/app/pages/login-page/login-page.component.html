<div class="flex items-center justify-center p-6 py-12">
  <div
    class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-xl w-full max-w-md p-8 sm:p-10 relative overflow-hidden"
  >
    <div
      class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-twine-dark via-twine to-twine-light"
    ></div>

    <div class="text-center mb-8">
      <span
        class="font-sans text-[9px] tracking-[4px] text-twine uppercase font-bold block mb-2"
      >
        ACCESO CLIENTES
      </span>
      <h1
        class="font-serif text-2xl sm:text-3xl text-woodsmoke tracking-[2px] uppercase"
      >
        Iniciar Sesión
      </h1>
      <div class="flex items-center justify-center gap-3 mt-3">
        <div class="h-[1px] w-8 bg-twine/40"></div>
        <div class="w-1.5 h-1.5 rotate-45 border border-twine"></div>
        <div class="h-[1px] w-8 bg-twine/40"></div>
      </div>
    </div>
    @if (successMessage) {
      <div
        class="bg-emerald-50 border border-emerald-200 text-emerald-900 p-4 rounded-[3px] mb-6 shadow-xs flex items-center gap-3"
      >
        <svg
          class="w-5 h-5 text-emerald-700 flex-shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <div>
          <h4
            class="font-bold text-xs uppercase tracking-wider text-emerald-800"
          >
            ¡Éxito!
          </h4>
          <p class="text-xs text-emerald-700 mt-0.5">{{ successMessage }}</p>
        </div>
      </div>
    }

    @if (errorMessage) {
      <div
        class="bg-red-50 border border-red-200 text-red-800 p-4 rounded-[3px] mb-6 shadow-xs flex items-center gap-3"
      >
        <svg
          class="w-5 h-5 text-red-600 flex-shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <div>
          <h4 class="font-bold text-xs uppercase tracking-wider text-red-700">
            Error de Autenticación
          </h4>
          <p class="text-xs text-red-600 mt-0.5">{{ errorMessage }}</p>
        </div>
      </div>
    }

    <form (ngSubmit)="onLogin()" class="space-y-5">
      <div>
        <label
          class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >
          Usuario o Correo Electrónico
        </label>
        <input
          type="text"
          [(ngModel)]="identifier"
          name="identifier"
          placeholder="ej. demo o demo@example.com"
          required
          class="w-full bg-pampas/60 border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-xs text-woodsmoke outline-none transition"
        />
      </div>

      <div>
        <label
          class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >
          Contraseña
        </label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          class="w-full bg-pampas/60 border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-xs text-woodsmoke outline-none transition"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading || isGoogleLoading"
        class="w-full bg-twine hover:bg-twine-hover disabled:opacity-60 disabled:cursor-not-allowed text-white text-[10px] uppercase tracking-[2px] font-bold py-3.5 px-6 rounded-[2px] transition duration-300 shadow-sm cursor-pointer"
      >
        {{ isLoading ? 'Validando...' : 'Validar e Iniciar Sesión' }}
      </button>
      <button
        type="button"
        (click)="onGoogleLogin()"
        [disabled]="isLoading || isGoogleLoading"
        class="w-full mt-3 bg-white border border-[#E8E2DA] text-woodsmoke hover:border-twine hover:text-twine-dark disabled:opacity-60 disabled:cursor-not-allowed text-[10px] uppercase tracking-[2px] font-bold py-3.5 px-6 rounded-[2px] transition duration-300 shadow-sm cursor-pointer flex items-center justify-center gap-2"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.04H12v3.86h5.38a4.6 4.6 0 0 1-2 3.02v2.53h3.24c1.9-1.75 3-4.33 3-7.37z"/>
          <path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.42l-3.24-2.53c-.9.6-2.05.96-3.38.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.61A10 10 0 0 0 12 22z"/>
          <path fill="#FBBC05" d="M6.39 13.88A6 6 0 0 1 6.07 12c0-.65.11-1.29.32-1.88V7.51H3.04A10 10 0 0 0 2 12c0 1.61.38 3.14 1.04 4.49l3.35-2.61z"/>
          <path fill="#EA4335" d="M12 5.99c1.47 0 2.79.51 3.83 1.51l2.87-2.88A9.65 9.65 0 0 0 12 2a10 10 0 0 0-8.96 5.51l3.35 2.61C7.18 7.75 9.39 5.99 12 5.99z"/>
        </svg>
        {{ isGoogleLoading ? 'Conectando...' : 'Continuar con Google' }}
      </button>
      <div class="pt-2 text-center">
        <p class="text-[10px] text-woodsmoke/50 uppercase tracking-wider mb-2">
          Acceso Rápido de Prueba:
        </p>
        <div class="flex justify-center gap-2">
          <button
            type="button"
            (click)="fillDemo('admin')"
            class="text-[10px] px-3 py-1 bg-pampas hover:bg-pampas/80 border border-[#E8E2DA] text-woodsmoke font-sans font-semibold rounded-[2px] transition cursor-pointer"
          >
            Admin (admin/admin)
          </button>
          <button
            type="button"
            (click)="fillDemo('demo')"
            class="text-[10px] px-3 py-1 bg-pampas hover:bg-pampas/80 border border-[#E8E2DA] text-woodsmoke font-sans font-semibold rounded-[2px] transition cursor-pointer"
          >
            Demo (demo/demo)
          </button>
        </div>
      </div>
    </form>

    <div class="mt-6 pt-6 border-t border-[#E8E2DA] text-center">
      <p class="text-xs text-woodsmoke/70 mb-3 font-medium">
        ¿Aún no eres miembro de Montclair?
      </p>
      <a
        routerLink="/clients/add"
        class="w-full inline-flex items-center justify-center gap-2 border-2 border-twine text-twine-dark hover:bg-twine hover:text-white text-[10px] uppercase tracking-[2px] font-bold py-3 px-6 rounded-[2px] transition duration-300 shadow-xs"
      >
        <svg
          class="w-3.5 h-3.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <line x1="19" y1="8" x2="19" y2="14"></line>
          <line x1="22" y1="11" x2="16" y2="11"></line>
        </svg>
        Crear Nueva Cuenta
      </a>
    </div>
  </div>
</div>
