<fieldset [formGroup]="form()" class="min-w-0">
  <legend class="flex items-center gap-3 w-full mb-4">
    <span
      class="w-6 h-6 shrink-0 grid place-items-center rounded-full bg-mirage text-twine text-[10px] font-bold"
      >3</span
    >
    <span
      class="text-[10px] uppercase tracking-[2.5px] font-bold text-twine-hover whitespace-nowrap"
      >Perfil</span
    >
    <span class="flex-1 h-px bg-[#E8E2DA]" aria-hidden="true"></span>
  </legend>

  <div class="grid grid-cols-1 gap-4" [class.sm:grid-cols-2]="isAdminView()">
    <div class="min-w-0">
      <label
        for="client-avatar"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >URL de foto de perfil (opcional)</label
      >
      <!-- Vista previa redonda al lado del campo cuando hay una URL -->
      <div class="flex items-center gap-3">
        <input
          id="client-avatar"
          type="url"
          formControlName="avatarUrl"
          placeholder="https://images.unsplash.com/..."
          class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition flex-1 min-w-0"
        />
        @if (avatarUrl) {
          <img
            [src]="avatarUrl"
            alt="Vista previa de la foto"
            class="w-11 h-11 shrink-0 rounded-full object-cover border-2 border-twine bg-pampas"
          />
        }
      </div>
    </div>

    @if (isAdminView()) {
      <div class="min-w-0">
        <label
          for="client-role"
          class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
          >Rol de usuario *</label
        >
        <div class="relative">
          <select
            id="client-role"
            formControlName="role"
            class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition appearance-none pr-9 cursor-pointer"
          >
            <option value="CLIENT">Huésped (CLIENT)</option>
            <option value="OPERATOR">Operario (OPERATOR)</option>
            <option value="ADMIN">Administrador (ADMIN)</option>
          </select>
          <svg
            class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-twine"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.2"
              d="M6 9l6 6 6-6"
            />
          </svg>
        </div>
      </div>
    }
  </div>
</fieldset>
