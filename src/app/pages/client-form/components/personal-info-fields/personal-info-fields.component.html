<fieldset [formGroup]="form()" class="min-w-0">
  <legend class="flex items-center gap-3 w-full mb-4">
    <span
      class="w-6 h-6 shrink-0 grid place-items-center rounded-full bg-mirage text-twine text-[10px] font-bold"
      >1</span
    >
    <span
      class="text-[10px] uppercase tracking-[2.5px] font-bold text-twine-hover whitespace-nowrap"
      >Datos personales</span
    >
    <span class="flex-1 h-px bg-[#E8E2DA]" aria-hidden="true"></span>
  </legend>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label
        for="client-firstName"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >Nombre *</label
      >
      <input
        type="text"
        id="client-firstName"
        formControlName="firstName"
        autocomplete="given-name"
        placeholder="ej. Alejandro"
        class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition"
        [class.border-red-400]="isInvalid('firstName')"
      />
      @if (isInvalid("firstName")) {
        <span class="text-[11px] text-red-600 mt-1 block"
          >Ingresa tu nombre (mínimo 2 letras).</span
        >
      }
    </div>

    <div>
      <label
        for="client-lastName"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >Apellido *</label
      >
      <input
        type="text"
        id="client-lastName"
        formControlName="lastName"
        autocomplete="family-name"
        placeholder="ej. Morales"
        class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition"
        [class.border-red-400]="isInvalid('lastName')"
      />
      @if (isInvalid("lastName")) {
        <span class="text-[11px] text-red-600 mt-1 block"
          >Ingresa tu apellido (mínimo 2 letras).</span
        >
      }
    </div>
  </div>
</fieldset>
