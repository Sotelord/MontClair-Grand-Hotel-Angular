<div class="max-w-2xl w-full mx-auto px-4 py-6 sm:p-8 lg:py-12">
  @if (isAdminView) {
    <a
      routerLink="/admin/clients"
      class="inline-flex items-center gap-2 mb-5 text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/60 hover:text-twine transition-colors"
    >
      <svg
        class="w-4 h-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 19l-7-7m0 0l7-7m-7 7h18"
        />
      </svg>
      Clientes
    </a>
  }

  <div
    class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-[0_10px_30px_-12px_rgba(20,30,38,0.22)] w-full p-5 sm:p-8 lg:p-10 relative overflow-hidden"
  >
    <div
      class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-twine-hover via-twine to-twine"
    ></div>

    <app-client-form-header [isEditMode]="isEditMode"></app-client-form-header>

    @if (errorMessage) {
      <div id="client-error-alert">
        <app-error-alert
          [message]="errorMessage"
          (closed)="errorMessage = null"
        ></app-error-alert>
      </div>
    }

    <form
      [formGroup]="clientForm"
      (ngSubmit)="onSubmit()"
      class="space-y-8"
      novalidate
    >
      <app-personal-info-fields [form]="clientForm"></app-personal-info-fields>
      <app-account-fields
        [form]="clientForm"
        [isEditMode]="isEditMode"
      ></app-account-fields>
      <app-profile-fields
        [form]="clientForm"
        [isAdminView]="isAdminView"
      ></app-profile-fields>
      <app-client-form-actions
        [isEditMode]="isEditMode"
        [isAdminView]="isAdminView"
      ></app-client-form-actions>
    </form>

    @if (!isEditMode && !isAdminView) {
      <app-login-link></app-login-link>
    }
  </div>
</div>
