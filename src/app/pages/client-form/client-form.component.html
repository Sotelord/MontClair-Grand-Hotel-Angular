<div class="flex items-center justify-center p-6 py-12">
  <div
    class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-xl w-full max-w-xl p-8 sm:p-10 relative overflow-hidden"
  >
    <div
      class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-twine-dark via-twine to-twine-light"
    ></div>
    <app-client-form-header [isEditMode]="isEditMode"></app-client-form-header>
    @if (errorMessage) {
      <app-error-alert
        [message]="errorMessage"
        (closed)="errorMessage = null"
      ></app-error-alert>
    }

    <form [formGroup]="clientForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <app-personal-info-fields [form]="clientForm"></app-personal-info-fields>
      <app-account-fields [form]="clientForm"></app-account-fields>
      <app-profile-fields
        [form]="clientForm"
        [isAdminView]="isAdminView"
      ></app-profile-fields>
      <app-client-form-actions
        [isEditMode]="isEditMode"
        [isAdminView]="isAdminView"
      ></app-client-form-actions>
    </form>

    @if (!isEditMode && !isAdminView) {
      <app-login-link></app-login-link>
    }
  </div>
</div>
