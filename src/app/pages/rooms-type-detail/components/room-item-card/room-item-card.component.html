<article
  class="h-full group bg-white rounded-[4px] overflow-hidden shadow-sm hover:shadow-xl transition-all duration-500 flex flex-col border border-[#E8E2DA]/80"
>
  <div class="p-5 flex flex-col flex-grow">
    <h3
      class="font-serif text-lg font-bold text-woodsmoke tracking-[2px] uppercase group-hover:text-twine transition-colors duration-300 mb-3"
    >
      Habitación {{ room().number }}
    </h3>
    <ul
      class="flex items-center gap-1.5 text-[9px] text-woodsmoke/60 font-medium mb-3 flex-wrap"
    >
      <li
        class="flex items-center gap-0.5 bg-pampas border border-[#E8E2DA] rounded-sm px-2 py-1"
      >
        Piso {{ room().floor }}
      </li>
      <li class="text-twine/40" aria-hidden="true">|</li>
      <li
        class="flex items-center gap-0.5 bg-pampas border border-[#E8E2DA] rounded-sm px-2 py-1"
      >
        {{ room().area }} m²
      </li>
      <li class="text-twine/40" aria-hidden="true">|</li>
      <li
        class="flex items-center gap-0.5 bg-pampas border border-[#E8E2DA] rounded-sm px-2 py-1"
      >
        <span aria-hidden="true">👤</span>
        <span>{{ room().capacity }} personas</span>
      </li>
    </ul>

    <p class="mb-4">
      @if (room().status === "AVAILABLE") {
        <span
          class="inline-block px-2 py-1 bg-green-100 text-green-800 text-[9px] uppercase tracking-wider rounded border border-green-200 font-bold"
          >Disponible</span
        >
      } @else {
        <span
          class="inline-block px-2 py-1 bg-red-100 text-red-800 text-[9px] uppercase tracking-wider rounded border border-red-200 font-bold"
          >Ocupada</span
        >
      }
    </p>

    <p class="text-[13px] font-bold text-woodsmoke mb-4 mt-auto">
      <span class="text-[#73503C]">Precio</span>
      <span> €{{ room().pricePerNight.toFixed(2).replace(".", ",") }}</span>
      <span class="text-[#73503C] font-normal text-[11px]"> / noche</span>
    </p>

    <div class="pt-3 border-t border-[#E8E2DA]">
      <button
        type="button"
        class="block w-full text-center border border-twine/70 text-twine hover:bg-twine hover:text-white text-[9px] uppercase tracking-[2px] font-bold py-2.5 rounded-[2px] transition-all duration-300 cursor-pointer"
      >
        Ver Detalles / Reservar
      </button>
    </div>
  </div>
</article>
