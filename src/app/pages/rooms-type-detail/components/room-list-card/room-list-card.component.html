<section
  class="bg-pampas py-14 px-6 lg:px-12"
  aria-labelledby="habitaciones-disponibles-titulo"
>
  <div class="max-w-7xl mx-auto">
    <div class="flex items-center justify-between mb-8">
      <h2
        id="habitaciones-disponibles-titulo"
        class="font-display text-2xl md:text-3xl text-woodsmoke tracking-[1px] italic font-medium"
      >
        Habitaciones Disponibles
      </h2>
      <a
        class="text-[10px] uppercase tracking-[2px] font-bold text-twine hover:text-twine-hover transition-colors"
      >
        &larr; Volver a Tipos
      </a>
    </div>

    <div
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
    >
      @for (room of rooms(); track room.id) {
        <app-room-item-card class="block h-full" [room]="room" />
      }

      @if (rooms().length === 0) {
        <div class="col-span-full py-12 text-center text-woodsmoke/60">
          <p>
            No hay habitaciones disponibles para esta categoría actualmente.
          </p>
        </div>
      }
    </div>
  </div>
</section>
