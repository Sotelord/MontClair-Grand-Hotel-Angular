<div
  class="p-6 bg-pampas/40 border border-[#E8E2DA] rounded-[2px] hover:border-twine transition-all group h-full"
>
  <span
    class="text-[9px] uppercase tracking-wider font-bold text-twine block mb-1"
  >
    {{ poi().category }}
  </span>

  <h3
    class="font-serif text-lg text-woodsmoke uppercase mb-2 group-hover:text-twine-dark transition"
  >
    {{ poi().name }}
  </h3>

  <div
    class="flex items-center gap-2 mb-3 text-xs font-sans text-twine font-semibold tracking-wide"
  >
    <span class="inline-flex items-center gap-1">
      <svg
        class="w-3.5 h-3.5 text-twine"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
        />
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
        />
      </svg>
      {{ poi().distance }}
    </span>
    <span class="text-woodsmoke/30">•</span>
    <span class="inline-flex items-center gap-1">
      <svg
        class="w-3.5 h-3.5 text-twine"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
      {{ poi().time }}
    </span>
  </div>

  <p class="text-[11px] text-woodsmoke/70 leading-relaxed font-light">
    {{ poi().description }}
  </p>
</div>
