<div
  class="p-5 lg:p-6 bg-white border border-[#E8E2DA] rounded-[2px] shadow-xs h-full flex gap-4 lg:block"
>
  <div
    class="w-9 h-9 lg:w-8 lg:h-8 shrink-0 rounded-full bg-twine/10 text-twine flex items-center justify-center font-bold text-xs lg:mb-4"
  >
    <svg
      class="w-4 h-4 text-twine"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M13 10V3L4 14h7v7l9-11h-7z"
      />
    </svg>
  </div>

  <div class="min-w-0">
    <h3
      class="font-serif text-[15px] lg:text-base text-woodsmoke uppercase leading-snug mb-1"
    >
      {{ transfer().title }}
    </h3>
    <span
      class="text-xs font-sans text-twine font-semibold tracking-wide block mb-2"
    >
      {{ transfer().duration }}
    </span>
    <p class="text-[13px] text-woodsmoke/70 font-light leading-relaxed">
      {{ transfer().details }}
    </p>
  </div>
</div>
