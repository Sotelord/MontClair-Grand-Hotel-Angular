<div class="min-h-[75vh] flex items-center justify-center p-6 py-12">
  <div class="bg-white border border-[#E8E2DA] border-t-4 border-t-twine rounded-[4px] shadow-2xl w-full max-w-xl p-8 sm:p-12 text-center relative overflow-hidden">
    <span class="text-[9px] uppercase tracking-[4px] text-twine font-bold block mb-3">
      MONTCLAIR GRAND HOTEL
    </span>

    <div class="w-16 h-16 mx-auto mb-6 rounded-full bg-red-50 border border-red-200 flex items-center justify-center text-red-600">
      <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>

    <h1 class="font-serif text-3xl sm:text-4xl text-woodsmoke tracking-[2px] uppercase mb-4">
      Ocurrió un error
    </h1>

    <div class="flex items-center justify-center gap-3 my-4">
      <div class="h-[1px] w-8 bg-twine/40"></div>
      <div class="w-1.5 h-1.5 rotate-45 border border-twine"></div>
      <div class="h-[1px] w-8 bg-twine/40"></div>
    </div>

    <p class="text-xs text-woodsmoke/70 leading-relaxed max-w-md mx-auto mb-8">
      {{ errorMessage }}
    </p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <a
        routerLink="/"
        class="w-full sm:w-auto bg-twine hover:bg-twine-hover text-white text-[10px] uppercase tracking-[2px] font-bold py-3.5 px-6 rounded-[2px] transition duration-300 shadow-sm"
      >
        Volver al Inicio
      </a>
      <button
        type="button"
        (click)="goBack()"
        class="w-full sm:w-auto border border-[#E8E2DA] hover:bg-pampas text-woodsmoke text-[10px] uppercase tracking-[2px] font-bold py-3.5 px-6 rounded-[2px] transition duration-300 cursor-pointer"
      >
        Regresar
      </button>
    </div>
  </div>
</div>
