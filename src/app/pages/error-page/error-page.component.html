<div class="min-h-[75vh] flex items-center justify-center p-6 py-12">
  <div
    class="bg-white border border-[#E8E2DA] border-t-4 border-t-twine rounded-[4px] shadow-2xl w-full max-w-xl p-8 sm:p-12 text-center relative overflow-hidden"
  >
    <span
      class="text-[9px] uppercase tracking-[4px] text-twine font-bold block mb-3"
    >
      MONTCLAIR GRAND HOTEL
    </span>
    <app-error-icon></app-error-icon>
    <h1
      class="font-serif text-3xl sm:text-4xl text-woodsmoke tracking-[2px] uppercase mb-4"
    >
      Ocurrió un error
    </h1>
    <app-ornament-divider class="block my-4"></app-ornament-divider>
    <p class="text-xs text-woodsmoke/70 leading-relaxed max-w-md mx-auto mb-8">
      {{ errorMessage }}
    </p>
    <app-error-actions (backClicked)="goBack()"></app-error-actions>
  </div>
</div>
