<section
  class="bg-pampas py-10 sm:py-14 px-4 sm:px-6 lg:px-12 w-full max-w-full overflow-hidden"
>
  <div class="rooms-carousel max-w-7xl mx-auto">
    <!-- Botón Anterior -->
    <button
      type="button"
      class="carousel-btn carousel-btn--prev"
      (click)="scrollPrev()"
      [disabled]="!canScrollPrev()"
      aria-label="Habitación anterior"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" />
      </svg>
    </button>

    <!-- Carrusel nativo con scroll-snap -->
    <div
      #carousel
      class="carousel-track flex overflow-x-auto snap-x snap-mandatory gap-6 pb-6 scroll-smooth"
      (scroll)="updateButtons()"
    >
      @for (roomType of roomTypesArray(); track roomType.id) {
        <div
          class="carousel-slide snap-start shrink-0 w-full sm:w-[calc(50%-12px)] lg:w-[calc(25%-18px)] flex justify-center"
        >
          <app-room-card
            [roomType]="roomType"
            [showFeatures]="false"
            actionText="Ver detalle"
            [linkToDetail]="true"
            (roomTypeSelected)="onRoomTypeSelected($event)"
            class="w-full max-w-[380px] sm:max-w-none flex"
          />
        </div>
      }
    </div>

    <!-- Botón Siguiente -->
    <button
      type="button"
      class="carousel-btn carousel-btn--next"
      (click)="scrollNext()"
      [disabled]="!canScrollNext()"
      aria-label="Habitación siguiente"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>
</section>
