<!--
  Celular: etiqueta arriba y select a todo el ancho; total y enlace a categorías en una fila.
  Desde md: todo en una fila, alineado abajo.
-->
<div
  class="bg-white border border-[#E8E2DA] rounded-[4px] p-4 shadow-[0_10px_30px_-12px_rgba(20,30,38,0.22)] grid grid-cols-2 md:grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto_auto] gap-3 md:items-end"
>
  <label class="block min-w-0 col-span-2 md:col-span-1">
    <span
      class="block text-[10px] uppercase tracking-[2px] text-woodsmoke/60 font-bold mb-1.5"
      >Categoría</span
    >
    <span class="relative block">
      <select
        [ngModel]="selectedTypeId()"
        (ngModelChange)="selectedTypeId.set($event)"
        class="w-full appearance-none h-11 pl-3 pr-9 text-base sm:text-sm bg-[#FAF8F5] border border-[#E8E2DA] rounded-[2px] text-woodsmoke focus:border-twine outline-none cursor-pointer"
      >
        <option value="ALL">Todas las categorías</option>
        @for (type of roomTypes(); track type.id) {
          <option [value]="type.id">{{ type.name }}</option>
        }
      </select>
      <svg
        class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-twine"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.2"
          d="M6 9l6 6 6-6"
        />
      </svg>
    </span>
  </label>

  <label class="block min-w-0 col-span-2 md:col-span-1">
    <span
      class="block text-[10px] uppercase tracking-[2px] text-woodsmoke/60 font-bold mb-1.5"
      >Estado</span
    >
    <span class="relative block">
      <select
        [ngModel]="selectedStatus()"
        (ngModelChange)="selectedStatus.set($event)"
        class="w-full appearance-none h-11 pl-3 pr-9 text-base sm:text-sm bg-[#FAF8F5] border border-[#E8E2DA] rounded-[2px] text-woodsmoke focus:border-twine outline-none cursor-pointer"
      >
        <option value="ALL">Todos los estados</option>
        <option value="AVAILABLE">Disponible</option>
        <option value="MAINTENANCE">En mantenimiento</option>
      </select>
      <svg
        class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-twine"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.2"
          d="M6 9l6 6 6-6"
        />
      </svg>
    </span>
  </label>

  <div
    class="h-11 flex items-center justify-between md:justify-center gap-3 px-4 bg-mirage text-white rounded-[2px]"
    aria-live="polite"
  >
    <span class="text-[10px] uppercase tracking-[2px] text-twine font-bold"
      >Total</span
    >
    <span class="font-serif text-lg font-semibold tabular-nums">{{
      total()
    }}</span>
  </div>

  <a
    routerLink="/admin/rooms-types"
    class="h-11 inline-flex items-center justify-center gap-1.5 text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke hover:text-twine border border-[#E8E2DA] hover:border-twine bg-white px-4 rounded-[2px] transition whitespace-nowrap"
  >
    Categorías →
  </a>
</div>
