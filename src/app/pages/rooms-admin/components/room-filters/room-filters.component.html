<div
  class="bg-white border border-[#E8E2DA] rounded-[4px] p-4 mb-6 shadow-sm flex flex-col md:flex-row gap-4 items-stretch md:items-center justify-between"
>
  <div class="flex flex-wrap items-center gap-3">
    <select
      [ngModel]="selectedTypeId()"
      (ngModelChange)="selectedTypeId.set($event)"
      class="py-2.5 px-3 text-xs bg-pampas/40 border border-[#E8E2DA] rounded-[2px] text-woodsmoke focus:border-twine outline-none cursor-pointer"
    >
      <option value="ALL">Todas las Categorías</option>
      @for (type of roomTypes(); track type.id) {
        <option [value]="type.id">{{ type.name }}</option>
      }
    </select>

    <select
      [ngModel]="selectedStatus()"
      (ngModelChange)="selectedStatus.set($event)"
      class="py-2.5 px-3 text-xs bg-pampas/40 border border-[#E8E2DA] rounded-[2px] text-woodsmoke focus:border-twine outline-none cursor-pointer"
    >
      <option value="ALL">Todos los Estados</option>
      <option value="AVAILABLE">Disponible</option>
      <option value="MAINTENANCE">En mantenimiento</option>
    </select>

    <span
      class="text-[11px] font-mono text-twine-dark font-semibold whitespace-nowrap bg-pampas px-3 py-2 rounded-[2px] border border-[#E8E2DA]"
    >
      Total: {{ total() }}
    </span>

    <a
      routerLink="/admin/rooms-types"
      class="text-[10px] uppercase tracking-wider font-bold text-woodsmoke hover:text-twine border border-[#E8E2DA] bg-white px-3 py-2.5 rounded-[2px] transition"
    >
      Categorías →
    </a>
  </div>
</div>
