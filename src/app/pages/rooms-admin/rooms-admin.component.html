<section class="max-w-7xl w-full mx-auto p-6 sm:p-8 lg:p-12">
  <app-admin-page-header
    superiorText="PANEL DE GESTIÓN"
    title="Habitaciones"
    description="Gestión del inventario, características y asignación de todas las estancias del hotel."
    buttonText="Añadir Habitación"
    (buttonClick)="onAddRoom()"
  />
  @if (successMessage) {
    <app-success-alert
      [message]="successMessage"
      [dismissible]="true"
      (closed)="successMessage = null"
    ></app-success-alert>
  }

  @if (errorMessage) {
    <app-error-alert
      [message]="errorMessage"
      (closed)="errorMessage = null"
    ></app-error-alert>
  }
  <app-room-filters
    [roomTypes]="roomTypes"
    [total]="filteredRooms.length"
    [(selectedTypeId)]="selectedTypeId"
    [(selectedStatus)]="selectedStatus"
  ></app-room-filters>
  <app-rooms-table
    [rooms]="filteredRooms"
    (editRequested)="onEditRoom($event)"
    (deleteRequested)="confirmDelete($event)"
  ></app-rooms-table>
  @if (roomToDelete) {
    <app-confirm-modal
      title="Confirmar Eliminación"
      confirmLabel="Eliminar"
      (confirmed)="executeDelete()"
      (cancelled)="cancelDelete()"
    >
      ¿Estás seguro de que deseas eliminar permanentemente la habitación
      <strong class="text-woodsmoke"
        >#{{ roomToDelete.number }} - {{ roomToDelete.name }}</strong
      >? Esta acción no se puede deshacer.
    </app-confirm-modal>
  }
</section>
