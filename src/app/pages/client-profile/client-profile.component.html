@if (client) {
  <div class="bg-pampas min-h-screen pb-24">
    <app-page-header
      superiorText="MONTCLAIR GRAND HOTEL"
      title="Mi Perfil & Estancias"
      description="Gestione su información personal, consulte el estado de cuenta de sus reservaciones y personalice cada detalle de su experiencia en MontClair Grand Hotel."
    ></app-page-header>

    <section class="max-w-6xl w-full mx-auto px-6 -mt-8 relative z-10 space-y-14">
      <!-- TARJETA DE MEMBRESÍA DEL HUÉSPED (CONTRASTE MIRAGE + MARFIL) -->
      <div
        class="bg-white border border-[#E8E2DA] shadow-xl overflow-hidden"
      >
        <div class="bg-mirage text-white px-8 py-8 sm:px-10 border-b-2 border-twine">
          <app-profile-header
            [client]="client"
            (logoutClicked)="logout()"
          ></app-profile-header>
        </div>

        <div class="px-8 py-6 sm:px-10 bg-white">
          @if (successMessage) {
            <div class="mb-6">
              <app-success-alert
                [message]="successMessage"
                [dismissible]="true"
                (closed)="successMessage = null"
              />
            </div>
          }
          @if (errorMessage) {
            <div class="mb-6">
              <app-error-alert
                [message]="errorMessage"
                (closed)="errorMessage = null"
              />
            </div>
          }
          <app-profile-stats
            [client]="client"
            [reservationsCount]="reservations.length"
          ></app-profile-stats>
        </div>
      </div>

      <!-- LISTADO EDITORIAL DE RESERVAS SOBRE FONDO PAMPAS -->
      <app-reservations-list
        [reservations]="reservations"
        [clientId]="client.id"
        [cancellingIds]="cancellingReservationIds"
        [payingIds]="payingReservationIds"
        (cancelRequested)="cancelReservation($event)"
        (payRequested)="payReservationWithBold($event)"
      ></app-reservations-list>

      <app-danger-zone
        [isDeleting]="isDeletingProfile"
        (deleteRequested)="deleteProfile()"
      ></app-danger-zone>
    </section>
  </div>
}
