@if (client) {
  <section class="max-w-5xl w-full mx-auto p-6 sm:p-8 lg:p-12">
    <div
      class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-lg p-6 sm:p-8 mb-8 relative overflow-hidden"
    >
      <div
        class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-twine-dark via-twine to-twine-light"
      ></div>

      <app-profile-header
        [client]="client"
        (logoutClicked)="logout()"
      ></app-profile-header>

      @if (successMessage) {
        <div class="mt-6">
          <app-success-alert
            [message]="successMessage"
            [dismissible]="true"
            (closed)="successMessage = null"
          />
        </div>
      }
      @if (errorMessage) {
        <div class="mt-6">
          <app-error-alert
            [message]="errorMessage"
            (closed)="errorMessage = null"
          />
        </div>
      }
      <app-profile-stats
        [client]="client"
        [reservationsCount]="reservations.length"
      ></app-profile-stats>
    </div>

    <app-reservations-list
      [reservations]="reservations"
      [clientId]="client.id"
      [cancellingIds]="cancellingReservationIds"
      (cancelRequested)="cancelReservation($event)"
    ></app-reservations-list>

    <app-danger-zone
      [isDeleting]="isDeletingProfile"
      (deleteRequested)="deleteProfile()"
    ></app-danger-zone>
  </section>
}
