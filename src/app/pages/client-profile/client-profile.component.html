@if (client) {
  <section class="max-w-5xl w-full mx-auto p-6 sm:p-8 lg:p-12">
    <div
      class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-lg mb-8 relative overflow-hidden"
    >
      <div
        class="relative flex items-center min-h-[92px] px-6 sm:px-10 py-4 bg-[#15232F] border-t-4 border-[#B8D7C2]"
      >
        <img
          src="images/Logo_oscuro_cropped.png"
          alt="MontClair Grand Hotel"
          class="w-44 sm:w-52 h-auto"
        />
      </div>

      <div class="p-6 sm:p-8">
        <app-profile-header
          [client]="client"
          (logoutClicked)="logout()"
        ></app-profile-header>

        @if (successMessage) {
          <div class="mt-6">
            <app-success-alert
              [message]="successMessage"
              [dismissible]="true"
              (closed)="successMessage = null"
            />
          </div>
        }
        @if (errorMessage) {
          <div class="mt-6">
            <app-error-alert
              [message]="errorMessage"
              (closed)="errorMessage = null"
            />
          </div>
        }
        <app-profile-stats
          [client]="client"
          [reservationsCount]="reservations.length"
        ></app-profile-stats>
      </div>
    </div>

    <app-reservations-list
      [reservations]="reservations"
      [clientId]="client.id"
      [cancellingIds]="cancellingReservationIds"
      [payingIds]="payingReservationIds"
      (cancelRequested)="cancelReservation($event)"
      (payRequested)="payReservationWithBold($event)"
    ></app-reservations-list>

    <app-danger-zone
      [isDeleting]="isDeletingProfile"
      (deleteRequested)="deleteProfile()"
    ></app-danger-zone>
  </section>
}
