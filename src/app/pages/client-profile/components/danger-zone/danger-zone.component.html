<div
  class="bg-white border border-[#E8E2DA] p-8 sm:p-10 transition-shadow hover:shadow-xl"
>
  <div
    class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6"
  >
    <div>
      <span
        class="font-sans text-[9px] uppercase tracking-[3px] text-twine font-bold block mb-2"
      >
        PRIVACIDAD &amp; GESTIÓN DE CUENTA
      </span>
      <h2 class="font-serif text-xl uppercase tracking-[1.5px] text-woodsmoke">
        Desactivación de Perfil
      </h2>
      <p class="text-xs text-woodsmoke/65 mt-2 max-w-xl leading-relaxed">
        Si desea dar de baja su perfil de huésped de forma permanente, tenga en cuenta que esta acción no se puede deshacer y requiere no tener estancias activas asociadas.
      </p>
    </div>

    <button
      type="button"
      (click)="deleteRequested.emit()"
      [disabled]="isDeleting()"
      class="border border-[#E8E2DA] hover:border-woodsmoke hover:bg-woodsmoke hover:text-white disabled:opacity-50 disabled:cursor-not-allowed text-woodsmoke/75 text-[10px] uppercase tracking-[2px] font-bold py-3.5 px-6 transition-colors duration-300 cursor-pointer shrink-0"
    >
      {{ isDeleting() ? "Eliminando..." : "Eliminar Perfil" }}
    </button>
  </div>
</div>
