<div
  class="bg-white border border-red-200 rounded-[4px] shadow-lg p-6 sm:p-8 mt-8"
>
  <div
    class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4"
  >
    <div>
      <h2 class="font-serif text-lg uppercase tracking-[1px] text-red-800">
        Zona de peligro
      </h2>
      <p class="text-xs text-woodsmoke/60 mt-1">
        Eliminar tu perfil borra permanentemente tu cuenta.
      </p>
    </div>

    <button
      type="button"
      (click)="deleteRequested.emit()"
      [disabled]="isDeleting()"
      class="bg-red-700 hover:bg-red-800 disabled:opacity-50 disabled:cursor-not-allowed text-white text-[10px] uppercase tracking-[1.5px] font-bold py-2.5 px-4 rounded-[2px] transition cursor-pointer"
    >
      {{ isDeleting() ? "Eliminando..." : "Eliminar Perfil" }}
    </button>
  </div>
</div>
