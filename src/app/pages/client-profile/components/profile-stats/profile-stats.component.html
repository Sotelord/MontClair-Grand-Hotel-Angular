<div
  class="grid grid-cols-1 sm:grid-cols-3 gap-6 sm:gap-0 sm:divide-x divide-[#E8E2DA]"
>
  <div class="sm:pr-6 flex items-center gap-4">
    <div class="w-10 h-10 border border-twine/40 bg-pampas/40 flex items-center justify-center text-twine shrink-0">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
      </svg>
    </div>
    <div>
      <span class="font-sans text-[9px] uppercase tracking-[2px] text-twine font-bold block mb-0.5"
        >Teléfono de Contacto</span
      >
      <span class="font-serif text-sm text-woodsmoke font-semibold tracking-wider">
        {{ client().phone || "No registrado" }}
      </span>
    </div>
  </div>

  <div class="sm:px-6 flex items-center gap-4">
    <div class="w-10 h-10 border border-twine/40 bg-pampas/40 flex items-center justify-center text-twine shrink-0">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
      </svg>
    </div>
    <div>
      <span class="font-sans text-[9px] uppercase tracking-[2px] text-twine font-bold block mb-0.5"
        >Nivel de Membresía</span
      >
      <span class="font-serif text-sm text-woodsmoke font-semibold tracking-wider uppercase">{{
        client().role === "CLIENT" ? "Huésped MontClair" : client().role
      }}</span>
    </div>
  </div>

  <div class="sm:pl-6 flex items-center gap-4">
    <div class="w-10 h-10 border border-twine/40 bg-pampas/40 flex items-center justify-center text-twine shrink-0">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
    </div>
    <div>
      <span class="font-sans text-[9px] uppercase tracking-[2px] text-twine font-bold block mb-0.5"
        >Historial de Estancias</span
      >
      <span class="font-serif text-sm text-woodsmoke font-semibold tracking-wider"
        >{{ reservationsCount() }} {{ reservationsCount() === 1 ? "Reserva Registrada" : "Reservas Registradas" }}</span
      >
    </div>
  </div>
</div>
