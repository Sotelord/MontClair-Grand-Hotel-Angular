<div
  class="flex flex-col sm:flex-row items-center justify-between gap-6"
>
  <div class="flex flex-col sm:flex-row items-center gap-6">
    <div class="p-1 border-2 border-twine rounded-full shadow-md bg-mirage">
      <img
        [src]="client().avatarUrl || defaultAvatar"
        [alt]="client().firstName"
        class="w-20 h-20 sm:w-24 sm:h-24 rounded-full object-cover"
      />
    </div>

    <div class="text-center sm:text-left">
      <span
        class="font-sans text-[9px] uppercase tracking-[3px] text-twine font-bold block mb-1.5"
      >
        {{
          client().role === "ADMIN"
            ? "ADMINISTRADOR DEL HOTEL"
            : "MEMBRESÍA PRIVILÈGE • HUÉSPED DISTINGUIDO"
        }}
      </span>

      <h2
        class="font-serif text-2xl sm:text-3xl text-white tracking-[2px] uppercase"
      >
        {{ client().firstName }} {{ client().lastName || "" }}
      </h2>

      <div class="flex items-center justify-center sm:justify-start gap-3 my-2.5">
        <div class="h-[1px] w-10 bg-twine/60"></div>
        <div class="w-1.5 h-1.5 rotate-45 border border-twine bg-twine"></div>
      </div>

      <p class="text-xs text-[#C2C9D1] font-sans tracking-wide">
        &#64;{{ client().username }} &bull; {{ client().email }}
      </p>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <a
      routerLink="/profile/edit"
      class="border border-twine text-twine hover:bg-twine hover:text-white text-[10px] uppercase tracking-[2px] font-bold py-3 px-5 transition-colors duration-300 cursor-pointer"
    >
      Editar Perfil
    </a>

    <button
      type="button"
      (click)="logoutClicked.emit()"
      class="border border-white/25 hover:border-white text-white/80 hover:text-white text-[10px] uppercase tracking-[2px] font-bold py-3 px-5 transition-colors duration-300 cursor-pointer"
    >
      Cerrar Sesión
    </button>
  </div>
</div>
