<aside class="space-y-6">
  <!-- TARJETA DE MEMBRESÍA ESTILO CREDENCIAL DE LUJO -->
  <div
    class="bg-mirage text-white p-6 border border-twine/40 shadow-xl relative overflow-hidden"
  >
    <div
      class="absolute top-0 right-0 w-32 h-32 bg-twine/10 rounded-full -translate-y-1/2 translate-x-1/2 pointer-events-none"
    ></div>

    <div class="relative z-10">
      <div class="flex items-start justify-between gap-3 mb-5">
        <div class="flex items-center gap-3.5 min-w-0">
          <div class="p-0.5 border-2 border-twine rounded-full shrink-0 bg-mirage">
            <img
              [src]="client().avatarUrl || defaultAvatar"
              [alt]="client().firstName"
              class="w-14 h-14 rounded-full object-cover"
            />
          </div>
          <div class="min-w-0">
            <span
              class="font-sans text-[9px] uppercase tracking-[2.5px] text-twine font-bold block"
            >
              {{ membershipLabel() }}
            </span>
            <h2
              class="font-serif text-lg text-white uppercase tracking-[1px] leading-tight truncate mt-0.5"
            >
              {{ client().firstName }} {{ client().lastName || "" }}
            </h2>
            <p class="text-[11px] text-[#C2C9D1] truncate mt-0.5">
              &#64;{{ client().username }}
            </p>
          </div>
        </div>
      </div>

      <div class="h-[1px] w-full bg-white/10 my-4"></div>

      <div class="flex items-end justify-between gap-4">
        <div>
          <span
            class="font-sans text-[8.5px] uppercase tracking-[2px] text-[#C2C9D1]/80 block"
          >
            N° DE MIEMBRO
          </span>
          <span class="font-serif text-sm tracking-[2px] text-white font-semibold">
            {{ memberCode() }}
          </span>
        </div>

        <div class="text-right">
          <span
            class="font-sans text-[8.5px] uppercase tracking-[2px] text-[#C2C9D1]/80 block"
          >
            BALANCE ACTUAL
          </span>
          <span class="font-serif text-lg text-twine font-semibold leading-none">
            {{ availablePoints() | number }}
            <span class="font-sans text-[9px] uppercase tracking-wider">pts</span>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- NAVBAR VERTICAL "MI CUENTA" -->
  <nav
    aria-label="Navegación de mi cuenta"
    class="bg-white border border-[#E8E2DA] shadow-sm overflow-hidden"
  >
    <div class="px-5 py-4 border-b border-[#E8E2DA] bg-[#FAF8F5]">
      <span
        class="font-sans text-[10px] uppercase tracking-[3px] text-woodsmoke font-bold"
      >
        Mi Cuenta
      </span>
    </div>

    <ul class="divide-y divide-[#F0EAE2]">
      @for (item of navItems; track item.id) {
        <li>
          <button
            type="button"
            (click)="selectTab(item.id)"
            class="w-full flex items-center justify-between gap-3 px-5 py-3.5 text-left transition-colors duration-200 cursor-pointer border-l-3"
            [ngClass]="
              activeTab() === item.id
                ? 'border-l-twine bg-[#FAF7F2] text-woodsmoke font-semibold'
                : 'border-l-transparent text-woodsmoke/75 hover:bg-[#FAF8F5] hover:text-woodsmoke'
            "
          >
            <span class="flex items-center gap-3 min-w-0">
              <span
                class="shrink-0"
                [ngClass]="
                  activeTab() === item.id ? 'text-twine' : 'text-woodsmoke/45'
                "
              >
                @switch (item.id) {
                  @case ("overview") {
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                  }
                  @case ("details") {
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                  }
                  @case ("edit") {
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                  }
                  @case ("reservations") {
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                  }
                  @case ("itinerary") {
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                    </svg>
                  }
                  @case ("rewards") {
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" />
                    </svg>
                  }
                  @case ("redeemed") {
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
                    </svg>
                  }
                  @case ("transactions") {
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                  }
                  @case ("security") {
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                    </svg>
                  }
                }
              </span>
              <span class="text-xs tracking-wide truncate">{{ item.label }}</span>
            </span>

            @if (item.id === "reservations" && reservationsCount() > 0) {
              <span
                class="px-2 py-0.5 text-[10px] font-bold shrink-0"
                [ngClass]="
                  activeTab() === item.id
                    ? 'bg-twine text-white'
                    : 'bg-pampas text-woodsmoke/75'
                "
              >
                {{ reservationsCount() }}
              </span>
            } @else if (item.id === "redeemed" && redeemedCount() > 0) {
              <span
                class="px-2 py-0.5 text-[10px] font-bold shrink-0"
                [ngClass]="
                  activeTab() === item.id
                    ? 'bg-twine text-white'
                    : 'bg-pampas text-woodsmoke/75'
                "
              >
                {{ redeemedCount() }}
              </span>
            }
          </button>
        </li>
      }
    </ul>

    <!-- ACCIÓN DE CIERRE DE SESIÓN -->
    <div class="p-4 border-t border-[#E8E2DA] bg-[#FAF8F5]">
      <button
        type="button"
        (click)="logoutClicked.emit()"
        class="w-full flex items-center justify-center gap-2 py-2.5 px-4 border border-[#E8E2DA] hover:border-woodsmoke hover:bg-woodsmoke hover:text-white text-woodsmoke/75 text-[10px] uppercase tracking-[2px] font-bold transition-colors duration-200 cursor-pointer"
      >
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Cerrar Sesión
      </button>
    </div>
  </nav>
</aside>
