<section class="max-w-5xl w-full mx-auto p-6 sm:p-8 lg:p-12">
  <app-detail-toolbar
    [reservationId]="isOperatorView ? null : (reservation?.id ?? null)"
    [isAdminView]="isAdminView"
    (backClicked)="goBack()"
  ></app-detail-toolbar>

  @if (isLoading) {
    <app-detail-loading></app-detail-loading>
  } @else if (errorMessage || !reservation) {
    <app-detail-not-found
      [message]="errorMessage"
      (backClicked)="goBack()"
    ></app-detail-not-found>
  } @else {
    <!-- DETALLE DE RESERVA -->
    <div
      class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-xl overflow-hidden relative"
    >
      <!-- TOP GOLD ACCENT -->
      <div
        class="h-2 bg-gradient-to-r from-twine-dark via-twine to-twine-light"
      ></div>

      <app-reservation-header
        [reservationId]="reservation.id"
        [status]="reservation.status"
        [paid]="reservation.paid"
      ></app-reservation-header>
      <!-- MAIN CONTENT GRID -->
      <div class="p-6 sm:p-10 space-y-8">
        <!-- SECCIÓN 1: HUÉSPED & ESTANCIA -->
        <div
          class="grid grid-cols-1 md:grid-cols-2 gap-6 pb-8 border-b border-[#E8E2DA]"
        >
          <!-- DATOS DEL HUÉSPED -->
          <app-guest-info-card
            [reservation]="reservation"
          ></app-guest-info-card>

          <!-- FECHAS DE ESTANCIA -->
          <app-stay-dates-card
            [checkInDate]="reservation.checkInDate"
            [checkOutDate]="reservation.checkOutDate"
            [nightsCount]="nightsCount"
          ></app-stay-dates-card>
        </div>

        <!-- SECCIÓN 2: HABITACIÓN RESERVADA -->
        <app-room-section
          [room]="assignedRoom"
          [pricePerNight]="roomPricePerNight"
        ></app-room-section>

        <!-- SECCIÓN 3: SERVICIOS CONTRATADOS -->
        <app-services-section
          [services]="acquiredServices"
        ></app-services-section>
        <!-- SECCIÓN 4: LIQUIDACIÓN FINANCIERA -->
        <app-account-summary
          [nightsCount]="nightsCount"
          [roomSubtotal]="roomSubtotal"
          [servicesSubtotal]="servicesSubtotal"
          [grandTotal]="grandTotal"
          [paid]="reservation.paid"
          [paidAmount]="reservation.paidAmount || 0"
          [pendingBalance]="reservation.pendingBalance"
        ></app-account-summary>
      </div>

      <!-- VOUCHER FOOTER -->
      <div
        class="p-6 bg-pampas/40 border-t border-[#E8E2DA] text-center text-[10px] text-woodsmoke/50 font-light"
      >
        MontClair Grand Hotel • Luxury Stay & Concierge Experience • Emitido
        electrónicamente sin necesidad de firma física.
      </div>
    </div>
  }
</section>
