<div
  class="p-5 bg-pampas/40 border border-[#E8E2DA] rounded-[2px] space-y-3 h-full"
>
  <span
    class="text-[9px] uppercase tracking-[2px] font-bold text-twine-dark block"
  >
    2. FECHAS DE ESTANCIA
  </span>

  <div class="grid grid-cols-2 gap-3 pt-1">
    <div class="p-3 bg-white border border-[#E8E2DA] rounded-[2px]">
      <span
        class="text-[9px] uppercase tracking-wider text-woodsmoke/50 block font-semibold"
        >Check-In (Llegada)</span
      >
      <span
        class="font-sans text-base font-semibold text-woodsmoke block mt-0.5"
        >{{ checkInDate() }}</span
      >
      <span class="text-[10px] text-woodsmoke/50"
        >A partir de las 15:00 hrs</span
      >
    </div>
    <div class="p-3 bg-white border border-[#E8E2DA] rounded-[2px]">
      <span
        class="text-[9px] uppercase tracking-wider text-woodsmoke/50 block font-semibold"
        >Check-Out (Salida)</span
      >
      <span
        class="font-sans text-base font-semibold text-woodsmoke block mt-0.5"
        >{{ checkOutDate() }}</span
      >
      <span class="text-[10px] text-woodsmoke/50">Hasta las 12:00 hrs</span>
    </div>
  </div>

  <div class="flex justify-between items-center text-xs text-woodsmoke/80 pt-1">
    <span>Duración calculada:</span>
    <span class="font-mono font-semibold text-twine-dark">
      {{ nightsCount() }} {{ nightsCount() === 1 ? "Noche" : "Noches" }}
    </span>
  </div>
</div>
