<div class="p-6 sm:p-10 border-b border-[#E8E2DA] bg-pampas/20">
  <div
    class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4"
  >
    <div>
      <div class="flex items-center gap-3 mb-1.5">
        <span class="text-[9px] uppercase tracking-[3px] font-bold text-twine"
          >MONTCLAIR GRAND HOTEL</span
        >
        <span class="text-woodsmoke/30">•</span>
        <span
          class="text-[9px] uppercase tracking-[2px] font-mono text-woodsmoke/60"
          >DETALLE DE RESERVA</span
        >
      </div>
      <h1
        class="font-sans font-bold text-2xl sm:text-3xl text-woodsmoke uppercase tracking-[2px]"
      >
        Reserva #{{ reservationId() }}
      </h1>
    </div>

    <div class="flex flex-col sm:items-end gap-1.5">
      <span
        class="px-3 py-1 rounded-[2px] text-[10px] uppercase tracking-[2px] font-bold border"
        [ngClass]="
          status() === 'CONFIRMED'
            ? 'bg-emerald-50 text-emerald-800 border-emerald-300'
            : 'bg-pampas text-woodsmoke border-[#E8E2DA]'
        "
      >
        {{ status() }}
      </span>
    </div>
  </div>
</div>
