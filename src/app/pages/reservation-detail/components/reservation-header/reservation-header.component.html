<div class="px-5 py-5 sm:p-8 lg:p-10 border-b border-[#E8E2DA] bg-[#FAF8F5]">
  <span
    class="block text-[10px] uppercase tracking-[2.5px] font-bold text-twine mb-1.5"
  >
    MontClair Grand Hotel <span class="text-woodsmoke/30 mx-1">•</span
    ><span class="text-woodsmoke/55">Detalle de reserva</span>
  </span>

  <div
    class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 sm:gap-6"
  >
    <h1
      class="font-serif text-2xl sm:text-3xl text-woodsmoke uppercase tracking-[2px] shrink-0"
    >
      Reserva #{{ reservationId() }}
    </h1>

    <div class="flex flex-wrap sm:flex-nowrap items-center gap-2 sm:shrink-0">
      <!-- ESTADO DE LA RESERVA -->
      @switch (status()) {
        @case ("ACTIVE") {
          <span
            class="whitespace-nowrap px-2.5 py-1 rounded-[2px] text-[10px] uppercase tracking-[1.5px] font-bold border bg-emerald-50 text-emerald-800 border-emerald-300 inline-flex items-center gap-1.5"
          >
            <span
              class="w-2 h-2 rounded-full bg-emerald-600 animate-pulse"
            ></span>
            En Estadía
          </span>
        }
        @case ("INACTIVE") {
          <span
            class="whitespace-nowrap px-2.5 py-1 rounded-[2px] text-[10px] uppercase tracking-[1.5px] font-bold border bg-slate-100 text-slate-700 border-slate-300"
          >
            Finalizada
          </span>
        }
        @case ("CANCELLED") {
          <span
            class="whitespace-nowrap px-2.5 py-1 rounded-[2px] text-[10px] uppercase tracking-[1.5px] font-bold border bg-rose-50 text-rose-700 border-rose-300"
          >
            Cancelada
          </span>
        }
        @default {
          <span
            class="whitespace-nowrap px-2.5 py-1 rounded-[2px] text-[10px] uppercase tracking-[1.5px] font-bold border bg-mirage text-twine border-mirage"
          >
            Confirmada
          </span>
        }
      }

      <!-- ESTADO DE PAGO DE LA CUENTA -->
      @if (paid()) {
        <span
          class="whitespace-nowrap px-2.5 py-1 rounded-[2px] text-[10px] uppercase tracking-[1.5px] font-bold border bg-emerald-50 text-emerald-700 border-emerald-200"
        >
          ✓ Pagada
        </span>
      } @else {
        <span
          class="whitespace-nowrap px-2.5 py-1 rounded-[2px] text-[10px] uppercase tracking-[1.5px] font-bold border bg-amber-50 text-amber-800 border-amber-300"
        >
          ⚠ Pendiente de pago
        </span>
      }
    </div>
  </div>
</div>
