<div class="no-print mb-5 sm:mb-6 flex items-center justify-between gap-3">
  <button
    type="button"
    (click)="backClicked.emit()"
    class="bg-twine hover:bg-twine-hover text-pampas text-[10px] uppercase tracking-[1.5px] font-bold py-2.5 px-4 rounded-[2px] transition-colors shadow-xs inline-flex items-center gap-2 cursor-pointer"
  >
    <svg
      class="w-3.5 h-3.5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M10 19l-7-7m0 0l7-7m-7 7h18"
      />
    </svg>
    <span>Volver</span>
  </button>

  @if (reservationId(); as id) {
    <a
      [routerLink]="
        isAdminView()
          ? ['/admin/reservations/edit', id]
          : ['/reservations/edit', id]
      "
      class="bg-twine hover:bg-twine-hover text-pampas text-[10px] uppercase tracking-[1.5px] font-bold py-2.5 px-4 rounded-[2px] transition-colors shadow-xs inline-flex items-center gap-2"
    >
      <svg
        class="w-3.5 h-3.5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
        />
      </svg>
      <span>Modificar</span>
    </a>
  }
</div>
