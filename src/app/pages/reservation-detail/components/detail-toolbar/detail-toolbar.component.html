<div class="mb-6 flex items-center justify-between">
  <button
    type="button"
    (click)="backClicked.emit()"
    class="inline-flex items-center gap-2 text-xs uppercase tracking-wider font-semibold text-woodsmoke/70 hover:text-twine transition cursor-pointer"
  >
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M10 19l-7-7m0 0l7-7m-7 7h18"
      />
    </svg>
    <span>Volver</span>
  </button>

  <div class="flex items-center gap-3">
    @if (reservationId(); as id) {
      <a
        [routerLink]="
          isAdminView()
            ? ['/admin/reservations/edit', id]
            : ['/reservations/edit', id]
        "
        style="background-color: #bf925a; color: #ffffff"
        class="hover:opacity-90 text-[10px] uppercase tracking-[1.5px] font-bold py-2 px-4 rounded-[2px] transition shadow-xs inline-flex items-center gap-2"
      >
        <svg
          class="w-3.5 h-3.5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
          />
        </svg>
        <span>Modificar</span>
      </a>
    }
  </div>
</div>
