<div
  class="bg-white border border-red-200 rounded-[4px] p-8 text-center max-w-lg mx-auto shadow-sm"
>
  <div
    class="w-12 h-12 rounded-full bg-red-50 text-red-600 flex items-center justify-center mx-auto mb-3"
  >
    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <circle cx="12" cy="12" r="10" stroke-width="2" />
      <line
        x1="12"
        y1="8"
        x2="12"
        y2="12"
        stroke-width="2"
        stroke-linecap="round"
      />
      <line
        x1="12"
        y1="16"
        x2="12.01"
        y2="16"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  </div>
  <h3
    class="font-sans font-bold text-lg uppercase tracking-wide text-woodsmoke mb-2"
  >
    Reserva no encontrada
  </h3>
  <p class="text-xs text-woodsmoke/60 mb-6">{{ message() }}</p>
  <button type="button" (click)="backClicked.emit()" class="btn btn-outline">
    Volver
  </button>
</div>
