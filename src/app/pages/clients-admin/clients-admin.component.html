<section class="max-w-6xl w-full mx-auto p-6 sm:p-8 lg:p-12">
  <app-admin-page-header
    superiorText="GESTIÓN DE HUÉSPEDES"
    title="Directorio de Clientes"
    description="Listado administrativo de cuentas de usuarios, clientes registrados y privilegios de acceso."
    buttonText="Añadir Nuevo Cliente"
    (buttonClick)="onAddClient()"
  />
  @if (successMessage) {
    <app-success-alert
      [message]="successMessage"
      [dismissible]="true"
      (closed)="successMessage = null"
    ></app-success-alert>
  }

  @if (errorMessage) {
    <app-error-alert
      [message]="errorMessage"
      (closed)="errorMessage = null"
    ></app-error-alert>
  }

  <app-client-filters
    [(selectedRole)]="selectedRole"
    [total]="filteredClients.length"
  ></app-client-filters>

  <app-clients-table
    [clients]="filteredClients"
    (editRequested)="onEditClient($event)"
    (deleteRequested)="confirmDelete($event)"
  ></app-clients-table>

  @if (clientToDelete) {
    <app-confirm-modal
      title="Confirmar Eliminación"
      confirmLabel="Eliminar"
      (confirmed)="executeDelete()"
      (cancelled)="cancelDelete()"
    >
      ¿Estás seguro de que deseas eliminar permanentemente al cliente
      <strong class="text-woodsmoke">
        {{ clientToDelete.firstName }} {{ clientToDelete.lastName || "" }} ({{
          clientToDelete.username
        }}) </strong
      >? Esta acción no se puede deshacer.
    </app-confirm-modal>
  }
</section>
