<div
  class="bg-white border border-[#E8E2DA] rounded-[4px] p-4 mb-6 shadow-sm flex flex-col sm:flex-row gap-4 items-stretch sm:items-center justify-between"
>
  <div class="flex items-center gap-3">
    <select
      [ngModel]="selectedRole()"
      (ngModelChange)="selectedRole.set($event)"
      class="py-2.5 px-3 text-xs bg-pampas/40 border border-[#E8E2DA] rounded-[2px] text-woodsmoke focus:border-twine outline-none cursor-pointer"
    >
      <option value="ALL">Todos los Roles</option>
      <option value="CLIENT">Clientes</option>
      <option value="OPERATOR">Operarios</option>
      <option value="ADMIN">Administradores</option>
    </select>

    <span
      class="text-[11px] font-mono text-twine-dark font-semibold whitespace-nowrap bg-pampas px-3 py-2 rounded-[2px] border border-[#E8E2DA]"
    >
      Total: {{ total() }}
    </span>
  </div>
</div>
