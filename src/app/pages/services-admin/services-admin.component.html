<section class="max-w-6xl w-full mx-auto p-6 sm:p-8 lg:p-12">
  <app-admin-page-header
    superiorText="GESTIÓN DE CATÁLOGO"
    title="Servicios del Hotel"
    description="Configuración y definición de experiencias y servicios."
    buttonText="Añadir Servicio"
    (buttonClick)="onAdd()"
  />
  <app-services-table
    [services]="services"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
  />
</section>
