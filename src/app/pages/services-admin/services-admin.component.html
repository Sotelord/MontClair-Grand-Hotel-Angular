<section class="max-w-6xl w-full mx-auto p-6 sm:p-8 lg:p-12">
  <app-admin-page-header
    superiorText="GESTIÓN DE CATÁLOGO"
    title="Servicios del Hotel"
    description="Configuración y definición de experiencias y servicios."
    buttonText="Añadir Servicio"
    (buttonClick)="onAdd()"
  />
  @if (errorMessage) {
    <div
      class="mb-6 p-4 rounded-[4px] bg-red-50 border border-red-200 text-red-800 text-xs font-semibold flex items-center justify-between"
      role="alert"
    >
      <span>{{ errorMessage }}</span>
      <button
        type="button"
        (click)="errorMessage = null"
        class="text-red-600 hover:text-red-800 text-sm"
        aria-label="Cerrar mensaje de error"
      >
        ✕
      </button>
    </div>
  }
  <app-services-table
    [services]="services"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
    (toggleVisibility)="onToggleVisibility($event)"
  />
</section>
