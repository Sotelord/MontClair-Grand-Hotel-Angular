<app-page-header
  superiorText="MONTCLAIR GRAND HOTEL"
  title="Galería"
  description="Una mirada a la elegancia, el confort y la exclusividad que te esperan en
      Montclair Grand Hotel. Cada rincón refleja nuestro compromiso con la
      distinción y la hospitalidad de lujo."
></app-page-header>

<app-category-filter
  [categories]="categories"
  [selectedId]="selectedCategory"
  (categorySelected)="setCategory($event)"
></app-category-filter>

<main class="bg-pampas/40 py-16 px-6 min-h-[500px]">
  <div class="max-w-6xl mx-auto">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (item of filteredItems; track item.id) {
        <div
          [class.md:col-span-2]="item.isWide"
          [class.h-96]="item.isWide"
          [class.h-80]="!item.isWide"
        >
          <app-gallery-card
            [item]="item"
            (opened)="openLightbox($event)"
          ></app-gallery-card>
        </div>
      }
    </div>
    <app-gallery-cta></app-gallery-cta>
  </div>
</main>
@if (selectedImage) {
  <app-gallery-lightbox
    [item]="selectedImage"
    (closed)="closeLightbox()"
  ></app-gallery-lightbox>
}
