<div
  class="fixed inset-0 z-50 bg-mirage/95 backdrop-blur-sm flex items-center justify-center p-3 sm:p-8 animate-fade-in"
  (click)="closed.emit()"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="item().title"
>
  <div
    class="lightbox-box relative max-w-4xl w-full bg-woodsmoke border border-twine/40 rounded-[3px] overflow-hidden shadow-2xl flex flex-col"
    (click)="$event.stopPropagation()"
  >
    <button
      type="button"
      (click)="closed.emit()"
      class="absolute top-3 right-3 sm:top-4 sm:right-4 z-20 text-white/80 hover:text-white bg-mirage/70 hover:bg-mirage rounded-full w-10 h-10 flex items-center justify-center transition border border-white/20 cursor-pointer"
      aria-label="Cerrar"
    >
      <span class="text-xl font-mono leading-none">&times;</span>
    </button>

    <div
      class="lightbox-media min-h-0 flex-1 overflow-hidden bg-black flex items-center justify-center"
    >
      <img
        [src]="item().imageUrl"
        [alt]="item().title"
        class="lightbox-img w-auto max-w-full object-contain"
      />
    </div>

    <div
      class="p-4 sm:p-6 bg-mirage text-white flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 sm:gap-4 shrink-0"
    >
      <div>
        <span
          class="text-[10px] uppercase tracking-[3px] font-bold text-twine block mb-1"
        >
          {{ item().categoryLabel }}
        </span>
        <h3
          class="font-serif text-lg sm:text-xl uppercase tracking-[1px] text-white"
        >
          {{ item().title }}
        </h3>
        <p class="text-[13px] sm:text-xs text-silver font-light mt-1 max-w-2xl">
          {{ item().description }}
        </p>
      </div>

      <a
        routerLink="/rooms/cards"
        (click)="closed.emit()"
        class="bg-twine hover:bg-twine-hover text-white text-[10px] uppercase tracking-widest font-bold py-2.5 px-5 rounded-[2px] transition whitespace-nowrap"
      >
        Reservar
      </a>
    </div>
  </div>
</div>
