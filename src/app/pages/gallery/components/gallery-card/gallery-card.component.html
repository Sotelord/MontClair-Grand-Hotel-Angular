<div
  class="relative group cursor-pointer rounded-[3px] overflow-hidden shadow-sm bg-white border border-[#E8E2DA] transition-all duration-500 hover:shadow-xl hover:border-twine h-full"
  (click)="opened.emit(item())"
>
  <img
    [src]="item().imageUrl"
    [alt]="item().title"
    class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-110"
    loading="lazy"
  />

  <div
    class="absolute inset-0 bg-gradient-to-t from-mirage/85 via-mirage/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-6"
  >
    <span class="text-[9px] uppercase tracking-[3px] font-bold text-twine mb-1">
      {{ item().categoryLabel }}
    </span>
    <h3
      class="font-serif text-lg sm:text-xl text-white uppercase tracking-[1px] mb-1"
    >
      {{ item().title }}
    </h3>
    <p class="text-xs text-white/80 font-light line-clamp-2">
      {{ item().description }}
    </p>
    <div
      class="mt-3 flex items-center text-twine-light text-[10px] tracking-wider uppercase font-semibold"
    >
      Ampliar Fotografía <span class="ml-1 text-sm">→</span>
    </div>
  </div>
</div>
