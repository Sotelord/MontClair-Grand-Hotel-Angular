<section class="bg-white border-b border-[#E8E2DA] shadow-xs relative z-10">
  <div class="filter-scroller max-w-6xl mx-auto overflow-x-auto py-3 sm:py-4">
    <div
      class="flex flex-nowrap items-center gap-2 sm:gap-3 w-max mx-auto px-4 sm:px-6"
      role="group"
      aria-label="Filtrar galería por categoría"
    >
      @for (cat of categories(); track cat.id) {
        <button
          type="button"
          (click)="select(cat.id, $event)"
          [attr.aria-pressed]="selectedId() === cat.id"
          class="shrink-0 whitespace-nowrap px-4 py-2.5 text-[11px] sm:text-xs uppercase tracking-widest font-semibold border transition-all duration-300 rounded-[2px] cursor-pointer"
          [ngClass]="
            selectedId() === cat.id
              ? 'bg-mirage border-mirage text-white shadow-sm'
              : 'bg-white border-[#E8E2DA] text-woodsmoke hover:bg-pampas hover:text-twine hover:border-twine/40'
          "
        >
          {{ cat.label }}
        </button>
      }
    </div>
  </div>
</section>
