<section class="bg-white border-b border-[#E8E2DA] shadow-xs relative z-10">
  <div class="max-w-6xl mx-auto px-6 py-4">
    <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-4">
      @for (cat of categories(); track cat.id) {
        <button
          type="button"
          (click)="categorySelected.emit(cat.id)"
          class="px-4 py-2 text-xs uppercase tracking-widest font-semibold transition-all duration-300 rounded-[2px] cursor-pointer"
          [ngClass]="
            selectedId() === cat.id
              ? 'bg-mirage text-white shadow-sm'
              : 'text-woodsmoke hover:bg-pampas hover:text-twine'
          "
        >
          {{ cat.label }}
        </button>
      }
    </div>
  </div>
</section>
