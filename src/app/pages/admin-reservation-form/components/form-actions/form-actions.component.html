<div class="pt-4 flex flex-col sm:flex-row gap-3">
  <button
    type="submit"
    [disabled]="isSubmitting() || isInvalid()"
    class="flex-1 bg-twine hover:bg-twine-hover text-white text-[10px] uppercase tracking-[2px] font-bold py-3.5 px-6 rounded-[2px] transition duration-300 shadow-sm cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
  >
    {{
      isSubmitting()
        ? "Procesando Reserva..."
        : isEditMode()
          ? "Guardar Cambios en Reserva"
          : "Confirmar y Crear Reserva"
    }}
  </button>

  <a
    routerLink="/admin/reservations"
    class="sm:w-auto text-center border border-[#E8E2DA] hover:bg-pampas text-woodsmoke/70 text-[10px] uppercase tracking-[2px] font-bold py-3.5 px-6 rounded-[2px] transition duration-300"
  >
    Cancelar
  </a>
</div>
