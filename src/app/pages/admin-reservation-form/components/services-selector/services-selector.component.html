<div>
  <label
    class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-2"
  >
    Servicios Adicionales (Cargo a la Cuenta)
  </label>

  <div
    class="grid grid-cols-1 sm:grid-cols-2 gap-2 border border-[#E8E2DA] rounded-[2px] p-3 bg-pampas/20"
  >
    @for (svc of services(); track svc.id) {
      <label
        class="flex items-center gap-3 p-2 rounded-[2px] hover:bg-white transition cursor-pointer"
      >
        <input
          type="checkbox"
          [checked]="selectedIds().has(svc.id)"
          (change)="toggled.emit(svc.id)"
          class="accent-twine"
        />

        <span class="text-xs text-woodsmoke flex-1 flex justify-between gap-2">
          <span>{{ svc.name }}</span>

          <span class="text-twine-dark font-mono font-medium">
            +{{ formatPrice(svc.price) }}
          </span>
        </span>
      </label>
    }
  </div>
</div>
