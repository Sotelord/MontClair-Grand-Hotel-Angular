<div class="flex items-center justify-center p-6 py-12">
  <div
    class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-xl w-full max-w-2xl p-8 sm:p-10 relative overflow-hidden"
  >
    <div
      class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-twine-dark via-twine to-twine-light"
    ></div>

    <app-form-header [isEditMode]="isEditMode"></app-form-header>

    @if (errorMessage) {
      <app-error-alert
        [message]="errorMessage"
        (closed)="errorMessage = null"
      ></app-error-alert>
    }

    <form
      [formGroup]="reservationForm"
      (ngSubmit)="onSubmit()"
      class="space-y-6"
    >
      <app-client-select
        [form]="reservationForm"
        [clients]="clients"
      ></app-client-select>

      <app-stay-details
        [form]="reservationForm"
        [isEditMode]="isEditMode"
        [todayDate]="todayDate"
        [minCheckOutDate]="minCheckOutDate"
      ></app-stay-details>

      <app-room-type-selector
        [form]="reservationForm"
        [roomTypes]="roomTypes"
      ></app-room-type-selector>

      <app-services-selector
        [services]="services"
        [selectedIds]="selectedServiceIds"
        (toggled)="toggleService($event)"
      ></app-services-selector>

      <app-price-summary
        [nightsCount]="nightsCount"
        [roomPrice]="selectedRoomPrice"
        [roomTotal]="estimatedRoomTotal"
        [servicesCount]="selectedServiceIds.size"
        [servicesTotal]="estimatedServicesTotal"
        [grandTotal]="estimatedGrandTotal"
      ></app-price-summary>

      <app-form-actions
        [isSubmitting]="isSubmitting"
        [isInvalid]="reservationForm.invalid"
        [isEditMode]="isEditMode"
      ></app-form-actions>
    </form>
  </div>
</div>
