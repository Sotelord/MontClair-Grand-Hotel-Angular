<article
  class="bg-white border border-[#E8E2DA] flex flex-col group transition-shadow hover:shadow-xl h-full"
>
  <div class="aspect-[4/3] overflow-hidden relative">
    <img
      [src]="service().imageUrl"
      [alt]="service().name"
      class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
    />
  </div>

  <div class="p-8 flex flex-col flex-1 text-center items-center">
    <span
      class="font-sans text-[9px] tracking-[2px] text-twine uppercase font-bold mb-3"
    >
      {{ service().tag || "EXPERIENCIA" }}
    </span>

    <h3
      class="font-serif text-lg md:text-xl text-woodsmoke tracking-[1px] uppercase mb-4"
    >
      {{ service().name }}
    </h3>

    <p class="text-[11px] text-woodsmoke/70 leading-relaxed mb-6 line-clamp-3">
      {{ service().description }}
    </p>

    <div class="flex gap-2 w-full justify-center mb-8">
      <span
        class="border border-[#E8E2DA] px-3 py-1.5 text-[9px] uppercase tracking-[1px] text-woodsmoke/80 font-semibold truncate"
      >
        {{ service().schedule || "24 HORAS" }}
      </span>
      <span
        class="border border-[#E8E2DA] px-3 py-1.5 text-[9px] uppercase tracking-[1px] text-woodsmoke/80 font-semibold truncate"
      >
        {{ service().priceLabel || "CONSULTAR" }}
      </span>
    </div>

    <div class="mt-auto w-full">
      <a
        [routerLink]="['/services', service().id]"
        class="block w-full border border-twine text-twine uppercase tracking-[2px] font-bold text-[10px] py-3.5 transition-colors duration-300 hover:bg-twine hover:text-white"
      >
        VER MÁS
      </a>
    </div>
  </div>
</article>
