<div class="bg-pampas min-h-screen pb-20">
  <app-page-header
    superiorText="MONTCLAIR GRAND HOTEL"
    title="Nuestros Servicios"
    description="Experiencias cuidadosamente seleccionadas para acompañar una estancia exquisita en Mónaco, con el mismo lenguaje visual refinado, cálido y mediterráneo de Montclair Grand Hotel."
  ></app-page-header>

  <section class="max-w-7xl mx-auto px-6 pt-16">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (service of services; track service.id) {
        <app-service-card [service]="service"></app-service-card>
      }
    </div>
  </section>
</div>
