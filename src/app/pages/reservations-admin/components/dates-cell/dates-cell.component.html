<div
  class="flex flex-col text-[11px] text-woodsmoke/80 space-y-0.5 tabular-nums whitespace-nowrap"
>
  <span>
    <strong class="text-twine-hover text-[9px] uppercase tracking-wider"
      >IN:</strong
    >
    {{ reservation().checkInDate }}
  </span>
  <span>
    <strong class="text-twine-hover text-[9px] uppercase tracking-wider"
      >OUT:</strong
    >
    {{ reservation().checkOutDate }}
  </span>
  <span class="text-[10px] text-woodsmoke/60 pt-0.5">
    {{ reservation().nights }}
    {{ reservation().nights === 1 ? "noche" : "noches" }} •
    {{ reservation().numberOfPeople }} huésp.
  </span>
</div>
