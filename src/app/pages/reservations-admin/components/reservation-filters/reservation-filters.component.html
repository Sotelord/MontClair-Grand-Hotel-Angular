<div
  class="bg-white border border-[#E8E2DA] rounded-[4px] p-4 mb-6 shadow-sm flex flex-col sm:flex-row gap-4 items-stretch sm:items-center justify-between"
>
  <div class="flex flex-wrap items-center gap-3">
    <div class="flex items-center gap-2">
      <label class="text-[10px] uppercase tracking-wider text-woodsmoke/60 font-semibold">Estado:</label>
      <select
        [ngModel]="selectedStatus()"
        (ngModelChange)="selectedStatus.set($event)"
        class="py-2 px-3 text-xs bg-pampas/40 border border-[#E8E2DA] rounded-[2px] text-woodsmoke focus:border-twine outline-none cursor-pointer"
      >
        <option value="ALL">Todos los Estados</option>
        <option value="CONFIRMED">Confirmada</option>
        <option value="ACTIVE">Activa (En Estadía)</option>
        <option value="INACTIVE">Inactiva (Finalizada)</option>
        <option value="CANCELLED">Cancelada</option>
      </select>
    </div>

    <div class="flex items-center gap-2">
      <label class="text-[10px] uppercase tracking-wider text-woodsmoke/60 font-semibold">Cuenta:</label>
      <select
        [ngModel]="selectedPayment()"
        (ngModelChange)="selectedPayment.set($event)"
        class="py-2 px-3 text-xs bg-pampas/40 border border-[#E8E2DA] rounded-[2px] text-woodsmoke focus:border-twine outline-none cursor-pointer"
      >
        <option value="ALL">Todos los Pagos</option>
        <option value="PAID">Cuenta Pagada (Limpia)</option>
        <option value="UNPAID">Cuenta con Saldo Pendiente</option>
      </select>
    </div>

    <span
      class="text-[11px] font-mono text-twine-dark font-semibold whitespace-nowrap bg-pampas px-3 py-2 rounded-[2px] border border-[#E8E2DA]"
    >
      Total: {{ total() }}
    </span>
  </div>
</div>
