<section class="max-w-[90rem] w-full mx-auto p-6 sm:p-8 lg:p-12">
  <app-admin-page-header
    superiorText="PANEL DE OPERARIO & GESTIÓN"
    title="Reservas del Hotel"
    description="Visualización completa de reservas generadas, datos del cliente, habitación asignada y cuenta detallada de servicios contratados."
    buttonText="Nueva Reserva"
    (buttonClick)="onAddReservation()"
  />
  @if (successMessage) {
    <app-success-alert
      [message]="successMessage"
      [dismissible]="true"
      (closed)="successMessage = null"
    ></app-success-alert>
  }
  @if (errorMessage) {
    <app-error-alert
      [message]="errorMessage"
      (closed)="errorMessage = null"
    ></app-error-alert>
  }
  <app-reservation-filters
    [(selectedStatus)]="selectedStatus"
    [total]="filteredReservations.length"
  ></app-reservation-filters>

  <app-reservations-table
    [reservations]="filteredReservations"
    (viewRequested)="onViewReservation($event)"
    (editRequested)="onEditReservation($event)"
    (deleteRequested)="confirmDelete($event)"
  ></app-reservations-table>

  @if (reservationToDelete) {
    <app-confirm-modal
      title="Confirmar Cancelación de Reserva"
      confirmLabel="Eliminar Reserva"
      (confirmed)="executeDelete()"
      (cancelled)="cancelDelete()"
    >
      ¿Estás seguro de que deseas eliminar permanentemente la reserva de
      <strong class="text-woodsmoke">
        {{ reservationToDelete.clientFirstName }}
        {{ reservationToDelete.clientLastName }} </strong
      >? La habitación asociada volverá a estar disponible para el inventario.
    </app-confirm-modal>
  }
</section>
