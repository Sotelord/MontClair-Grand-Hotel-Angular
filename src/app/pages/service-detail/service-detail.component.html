@if (service) {
  <div class="bg-pampas min-h-screen pb-20">
    <app-page-header
      superiorText="MONTCLAIR GRAND HOTEL"
      [title]="service.name"
      [description]="service.description"
    ></app-page-header>
    <section class="max-w-6xl mx-auto px-6 pt-16">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16">
        <app-service-images
          class="lg:col-span-5"
          [service]="service"
        ></app-service-images>

        <div class="lg:col-span-7 flex flex-col justify-center">
          <h4
            class="font-sans text-[9px] tracking-[3px] text-twine uppercase font-bold mb-4"
          >
            {{ service.tagline || service.tag }}
          </h4>
          <h2
            class="font-serif text-3xl md:text-4xl text-woodsmoke tracking-[1px] uppercase mb-6 leading-snug"
          >
            {{ service.headline || service.name }}
          </h2>

          <div class="flex items-center justify-start gap-3 mb-6">
            <div class="h-[1px] w-12 bg-twine"></div>
            <div class="w-1.5 h-1.5 rotate-45 border border-twine"></div>
          </div>

          <p class="text-woodsmoke/70 text-sm leading-relaxed mb-10 font-sans">
            {{ service.fullDescription || service.description }}
          </p>

          @if (service.highlights && service.highlights.length > 0) {
            <app-service-highlights
              class="mb-10"
              [highlights]="service.highlights"
            ></app-service-highlights>
          }

          <app-service-schedule-price
            class="mb-6"
            [service]="service"
          ></app-service-schedule-price>

          <button
            (click)="onReserve()"
            class="w-full bg-twine hover:bg-twine-hover text-white py-4 font-sans text-[11px] uppercase tracking-[3px] font-bold transition-colors duration-300"
          >
            RESERVAR EXPERIENCIA
          </button>
        </div>
      </div>
    </section>

    @if (service.galleryImages && service.galleryImages.length > 0) {
      <app-service-gallery
        [images]="service.galleryImages"
      ></app-service-gallery>
    }
  </div>
}
