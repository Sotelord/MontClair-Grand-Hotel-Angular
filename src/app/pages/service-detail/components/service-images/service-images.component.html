<div class="flex flex-col gap-8">
  <div class="border-[8px] border-mirage shadow-2xl relative">
    <img
      [src]="service().imageUrl"
      [alt]="service().name"
      class="w-full h-auto object-cover aspect-[4/3]"
    />
  </div>

  @if (service().secondaryImageUrl) {
    <div class="relative mt-4 pl-4 pb-4">
      <div
        class="absolute inset-0 border border-twine bg-pampas -z-10 translate-x-4 translate-y-4"
      ></div>
      <img
        [src]="service().secondaryImageUrl"
        alt="Secondary View"
        class="w-full h-auto object-cover aspect-[4/3] border-[6px] border-white shadow-md"
      />
    </div>
  }
</div>
