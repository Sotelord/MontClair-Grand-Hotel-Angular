<div [formGroup]="form()" class="space-y-6">
  <div>
    <label
      class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
    >
      Nombre del Servicio *
    </label>
    <input
      type="text"
      formControlName="name"
      placeholder="ej. Restaurante Gourmet"
      class="w-full bg-pampas/60 border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-xs text-woodsmoke outline-none transition"
    />
    @if (error("name"); as msg) {
      <p class="text-[11px] text-red-600 mt-1">{{ msg }}</p>
    }
  </div>

  <div>
    <label
      class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
    >
      Descripción *
    </label>
    <textarea
      formControlName="description"
      rows="3"
      placeholder="Descripción corta del servicio..."
      class="w-full bg-pampas/60 border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-xs text-woodsmoke outline-none transition resize-none"
    ></textarea>
    @if (error("description"); as msg) {
      <p class="text-[11px] text-red-600 mt-1">{{ msg }}</p>
    }
  </div>
</div>
