<fieldset [formGroup]="form()" class="min-w-0">
  <legend class="flex items-center gap-3 w-full mb-4">
    <span
      class="w-6 h-6 shrink-0 grid place-items-center rounded-full bg-mirage text-twine text-[10px] font-bold"
      >1</span
    >
    <span
      class="text-[10px] uppercase tracking-[2.5px] font-bold text-twine-hover whitespace-nowrap"
      >Información</span
    >
    <span class="flex-1 h-px bg-[#E8E2DA]" aria-hidden="true"></span>
  </legend>

  <div class="space-y-4">
    <div>
      <label
        for="sv-name"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >Nombre del servicio *</label
      >
      <input
        id="sv-name"
        type="text"
        formControlName="name"
        placeholder="ej. Restaurante Gourmet"
        class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition"
        [class.border-red-400]="error('name')"
      />
      @if (error("name"); as msg) {
        <p class="text-[11px] text-red-600 mt-1">{{ msg }}</p>
      }
    </div>

    <div>
      <label
        for="sv-description"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >Descripción *</label
      >
      <textarea
        id="sv-description"
        formControlName="description"
        rows="4"
        placeholder="ej. Cocina de autor con productos locales y vista a la ciudad..."
        class="w-full bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-base sm:text-sm text-woodsmoke outline-none transition resize-y min-h-[100px]"
        [class.border-red-400]="error('description')"
      ></textarea>
      @if (error("description"); as msg) {
        <p class="text-[11px] text-red-600 mt-1">{{ msg }}</p>
      }
    </div>
  </div>
</fieldset>
