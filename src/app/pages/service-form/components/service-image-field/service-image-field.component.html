<fieldset [formGroup]="form()" class="min-w-0">
  <legend class="flex items-center gap-3 w-full mb-4">
    <span
      class="w-6 h-6 shrink-0 grid place-items-center rounded-full bg-mirage text-twine text-[10px] font-bold"
      >3</span
    >
    <span
      class="text-[10px] uppercase tracking-[2.5px] font-bold text-twine-hover whitespace-nowrap"
      >Imagen principal</span
    >
    <span class="flex-1 h-px bg-[#E8E2DA]" aria-hidden="true"></span>
  </legend>

  <div>
    <label
      for="sv-image"
      class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
      >URL de la imagen *</label
    >
    <input
      id="sv-image"
      type="url"
      formControlName="imageUrl"
      placeholder="https://images.unsplash.com/photo-..."
      class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition"
      [class.border-red-400]="error('imageUrl')"
    />
    @if (error("imageUrl"); as msg) {
      <p class="text-[11px] text-red-600 mt-1">{{ msg }}</p>
    } @else {
      <p class="text-[11px] text-woodsmoke/50 mt-1.5">
        Usa una imagen de alta resolución; representa al servicio en la página
        pública.
      </p>
    }

    @if (imageUrl) {
      <div
        class="mt-3 relative h-40 sm:h-48 rounded-[2px] overflow-hidden border border-[#E8E2DA] bg-pampas"
      >
        <img
          [src]="imageUrl"
          alt="Vista previa de la imagen"
          class="w-full h-full object-cover"
        />
        <span
          class="absolute bottom-2 left-2 px-2 py-0.5 text-[9px] uppercase tracking-[1.5px] font-bold bg-mirage/85 text-twine rounded-[2px]"
        >
          Vista previa
        </span>
      </div>
    }
  </div>
</fieldset>
