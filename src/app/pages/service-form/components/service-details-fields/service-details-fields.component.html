<fieldset [formGroup]="form()" class="min-w-0">
  <legend class="flex items-center gap-3 w-full mb-4">
    <span
      class="w-6 h-6 shrink-0 grid place-items-center rounded-full bg-mirage text-twine text-[10px] font-bold"
      >2</span
    >
    <span
      class="text-[10px] uppercase tracking-[2.5px] font-bold text-twine-hover whitespace-nowrap"
      >Tarifa y horario</span
    >
    <span class="flex-1 h-px bg-[#E8E2DA]" aria-hidden="true"></span>
  </legend>

  <div class="space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-[180px_minmax(0,1fr)] gap-4">
      <div class="min-w-0">
        <label
          for="sv-price"
          class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
          >Tarifa base *</label
        >
        <div class="relative">
          <span
            class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm text-twine-hover font-semibold"
            >€</span
          >
          <input
            id="sv-price"
            type="number"
            step="0.01"
            min="0"
            inputmode="decimal"
            formControlName="price"
            placeholder="40.00"
            class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition pl-7 tabular-nums"
            [class.border-red-400]="error('price')"
          />
        </div>
        @if (error("price"); as msg) {
          <p class="text-[11px] text-red-600 mt-1">{{ msg }}</p>
        } @else {
          <p class="text-[11px] text-woodsmoke/50 mt-1.5">
            Usa 0 si el servicio no tiene costo.
          </p>
        }
      </div>

      <div class="min-w-0">
        <label
          for="sv-tag"
          class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
          >Etiqueta *</label
        >
        <input
          id="sv-tag"
          type="text"
          formControlName="tag"
          placeholder="ej. EXPERIENCIA 01"
          class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition uppercase placeholder:normal-case"
          [class.border-red-400]="error('tag')"
        />
        @if (error("tag"); as msg) {
          <p class="text-[11px] text-red-600 mt-1">{{ msg }}</p>
        } @else {
          <p class="text-[11px] text-woodsmoke/50 mt-1.5">
            Texto corto que aparece sobre la tarjeta del servicio.
          </p>
        }
      </div>
    </div>

    <div>
      <label
        for="sv-schedule"
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
        >Horario *</label
      >
      <div class="relative">
        <svg
          class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-twine"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3 2"></path>
        </svg>
        <input
          id="sv-schedule"
          type="text"
          formControlName="schedule"
          placeholder="ej. 8:00 AM - 10:00 PM"
          class="w-full h-11 bg-[#FAF8F5] border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] px-3 text-base sm:text-sm text-woodsmoke outline-none transition pl-9"
          [class.border-red-400]="error('schedule')"
        />
      </div>
      @if (error("schedule"); as msg) {
        <p class="text-[11px] text-red-600 mt-1">{{ msg }}</p>
      }
    </div>
  </div>
</fieldset>
