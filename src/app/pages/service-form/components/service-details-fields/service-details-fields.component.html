<div [formGroup]="form()" class="space-y-6">
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
    <div>
      <label
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
      >
        Tarifa Base (€) *
      </label>
      <input
        type="number"
        formControlName="price"
        placeholder="ej. 40.0"
        class="w-full bg-pampas/60 border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-xs text-woodsmoke outline-none transition"
      />
      @if (error("price"); as msg) {
        <p class="text-[11px] text-red-600 mt-1">{{ msg }}</p>
      }
    </div>

    <div>
      <label
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
      >
        Tag / Etiqueta *
      </label>
      <input
        type="text"
        formControlName="tag"
        placeholder="ej. EXPERIENCIA 01"
        class="w-full bg-pampas/60 border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-xs text-woodsmoke outline-none transition"
      />
      @if (error("tag"); as msg) {
        <p class="text-[11px] text-red-600 mt-1">{{ msg }}</p>
      }
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
    <div>
      <label
        class="block font-sans text-[10px] uppercase tracking-[1.5px] font-bold text-woodsmoke/80 mb-1.5"
      >
        Horario *
      </label>
      <input
        type="text"
        formControlName="schedule"
        placeholder="ej. 8:00 AM - 10:00 PM"
        class="w-full bg-pampas/60 border border-[#E8E2DA] focus:border-twine focus:ring-1 focus:ring-twine rounded-[2px] p-3 text-xs text-woodsmoke outline-none transition"
      />
      @if (error("schedule"); as msg) {
        <p class="text-[11px] text-red-600 mt-1">{{ msg }}</p>
      }
    </div>
  </div>
</div>
