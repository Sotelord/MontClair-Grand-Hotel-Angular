<div class="min-h-screen bg-pampas font-sans">
  <app-service-form-banner [isEditMode]="isEditMode"></app-service-form-banner>

  <div class="flex items-center justify-center p-6 py-12">
    <div
      class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-xl w-full max-w-2xl p-8 sm:p-10 relative overflow-hidden"
    >
      <div
        class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-twine-dark via-twine to-twine-light"
      ></div>

      <form
        [formGroup]="serviceForm"
        (ngSubmit)="handleSubmit()"
        class="space-y-6"
      >
        <app-service-main-fields [form]="serviceForm"></app-service-main-fields>
        <app-service-details-fields
          [form]="serviceForm"
        ></app-service-details-fields>
        <app-service-image-field [form]="serviceForm"></app-service-image-field>
        <app-service-form-actions></app-service-form-actions>
      </form>
    </div>
  </div>
</div>
