@if (room) {
  <section class="max-w-6xl w-full mx-auto p-6 sm:p-8 lg:p-12">
    <app-room-breadcrumb [roomName]="room.name"></app-room-breadcrumb>

    <div
      class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-xl overflow-hidden mb-12"
    >
      <!-- IMAGEN PRINCIPAL -->
      <app-room-hero [room]="room"></app-room-hero>
      <!-- INFORMACIÓN -->
      <div class="p-8 sm:p-12 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
          <div>
            <h2
              class="font-serif text-xl uppercase tracking-wider text-woodsmoke mb-3"
            >
              Descripción
            </h2>

            <p class="text-xs text-woodsmoke/70 leading-relaxed">
              {{
                room.fullDescription ||
                  room.heroDescription ||
                  room.roomType.description
              }}
            </p>
          </div>

          @if (room.highlights && room.highlights.length > 0) {
            <app-room-highlights
              [highlights]="room.highlights"
            ></app-room-highlights>
          }
        </div>

        <!-- PRECIO Y ACCIONES -->
        <app-room-pricing [room]="room"></app-room-pricing>
      </div>
    </div>
  </section>
}
