<div class="flex items-center justify-center p-6 py-12">
  <div
    class="bg-white border border-[#E8E2DA] rounded-[4px] shadow-xl w-full max-w-xl p-8 sm:p-10 relative overflow-hidden"
  >
    <div
      class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-twine-dark via-twine to-twine-light"
    ></div>
    <app-room-type-form-header
      [isEditMode]="isEditMode"
    ></app-room-type-form-header>

    <form
      [formGroup]="roomTypeForm"
      (ngSubmit)="handleSubmit()"
      class="space-y-5"
    >
      <app-room-type-fields [form]="roomTypeForm"></app-room-type-fields>
      <app-room-type-form-actions
        [isEditMode]="isEditMode"
        [isInvalid]="roomTypeForm.invalid"
      ></app-room-type-form-actions>
    </form>
  </div>
</div>
